# =============================================================================
# Farm360 AI — Docker Compose (LOCAL DEVELOPMENT ONLY)
# Auth: F360-AUTH-2026-001. Multi-tenant: F360-MTA-2026-001
#
#   docker compose up -d                  → SQL Server + Redis + Seq (run the API/SPA from your IDE)
#   docker compose --profile app up -d    → also the API (http://localhost:5000) and SPA (http://localhost:4300)
#
# The passwords below are throw-away development defaults. Production uses docker-compose.prod.yml,
# which takes every secret from the environment (see deploy/.env.example).
# =============================================================================

services:

  # ── SQL Server 2022 (Developer edition — not licensed for production) ───────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: farm360-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Farm360_Dev!2026}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - farm360-net

  # ── Redis 7.x ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: farm360-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Farm360Redis2026}", "--save", "60", "1"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:-Farm360Redis2026}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - farm360-net

  # ── Seq (Structured Log UI) → http://localhost:8081 ────────────────────────
  seq:
    image: datalust/seq:2024
    container_name: farm360-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"   # Ingestion
      - "8081:80"     # UI
    volumes:
      - seq_data:/data
    networks:
      - farm360-net

  # ── Farm360 API (profile: app) ─────────────────────────────────────────────
  # Hangfire dashboard is Development-only and local-requests-only: http://localhost:5000/hangfire
  # is reachable only from inside the container, so use `dotnet run` for dashboard work.
  farm360-api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Farm360.Api/Dockerfile
    container_name: farm360-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Farm360;User Id=sa;Password=${SQL_SA_PASSWORD:-Farm360_Dev!2026};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-Farm360Redis2026},abortConnect=false"
      Database__MigrateOnStartup: "true"
      Seed__DemoData: "true"
      Serilog__Seq__ServerUrl: "http://seq:5341"
      Serilog__Console__Json: "false"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:4300"
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
    ports:
      - "5000:8080"
    volumes:
      - api_uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farm360-net

  # ── Farm360 SPA (profile: app) → http://localhost:4300 ─────────────────────
  farm360-web:
    profiles: ["app"]
    build:
      context: src/Farm360.Web
    container_name: farm360-web
    environment:
      API_UPSTREAM: "http://farm360-api:8080"
    ports:
      - "4300:8080"
    depends_on:
      - farm360-api
    networks:
      - farm360-net

volumes:
  sqlserver_data:
  redis_data:
  seq_data:
  api_uploads:

networks:
  farm360-net:
    driver: bridge
