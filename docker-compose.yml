version: '3.9'

# =============================================================================
# Farm360 AI — Docker Compose
# Local development stack. Auth: F360-AUTH-2026-001. Multi-tenant: F360-MTA-2026-001
# =============================================================================

services:

  # ── SQL Server 2022 ────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: farm360-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQL_SA_PASSWORD:-Farm360_Dev!2026}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - farm360-net

  # ── Redis 7.x ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: farm360-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Farm360Redis2026}", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Farm360Redis2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - farm360-net

  # ── Seq (Structured Log UI) ────────────────────────────────────────────────
  seq:
    image: datalust/seq:2024
    container_name: farm360-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ""
    ports:
      - "5341:5341"   # Ingestion
      - "8081:80"     # UI → http://localhost:8081
    volumes:
      - seq_data:/data
    networks:
      - farm360-net

  # ── Hangfire Dashboard proxy (no separate container — embedded in API) ─────
  # Available at: http://localhost:5000/hangfire (dev only, secured)

  # ── Farm360 API ────────────────────────────────────────────────────────────
  farm360-api:
    build:
      context: .
      dockerfile: src/Farm360.Api/Dockerfile
    container_name: farm360-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Farm360;User Id=sa;Password=Farm360_Dev!2026;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379,password=Farm360Redis2026"
      Serilog__WriteTo__0__Name: "Seq"
      Serilog__WriteTo__0__Args__serverUrl: "http://seq:5341"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farm360-net

volumes:
  sqlserver_data:
  redis_data:
  seq_data:

networks:
  farm360-net:
    driver: bridge
