<div class="space-y-4">
  <label class="label" *ngIf="label">
    <span class="label-text font-medium text-gray-700 dark:text-gray-300">
      {{ label }} <span *ngIf="required" class="text-red-500">*</span>
    </span>
  </label>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Country -->
    <div class="form-control w-full">
      <select class="select select-bordered w-full bg-white dark:bg-gray-800 focus:ring-2 focus:ring-green-500"
              [ngModel]="selectedCountryId()" (ngModelChange)="onCountryChange($event)" [disabled]="isDisabled()">
        <option value="" disabled selected>Select Country</option>
        <option *ngFor="let c of countries()" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <!-- Division -->
    <div class="form-control w-full" *ngIf="['division', 'district', 'upazila', 'union', 'village'].includes(selectionLevel)">
      <select class="select select-bordered w-full bg-white dark:bg-gray-800 focus:ring-2 focus:ring-green-500"
              [ngModel]="selectedDivisionId()" (ngModelChange)="onDivisionChange($event)" [disabled]="isDisabled() || !selectedCountryId()">
        <option value="" disabled selected>Select Division</option>
        <option *ngFor="let d of divisions()" [value]="d.id">{{ d.name }}</option>
      </select>
    </div>

    <!-- District -->
    <div class="form-control w-full" *ngIf="['district', 'upazila', 'union', 'village'].includes(selectionLevel)">
      <select class="select select-bordered w-full bg-white dark:bg-gray-800 focus:ring-2 focus:ring-green-500"
              [ngModel]="selectedDistrictId()" (ngModelChange)="onDistrictChange($event)" [disabled]="isDisabled() || !selectedDivisionId()">
        <option value="" disabled selected>Select District</option>
        <option *ngFor="let d of districts()" [value]="d.id">{{ d.name }}</option>
      </select>
    </div>

    <!-- Upazila -->
    <div class="form-control w-full" *ngIf="['upazila', 'union', 'village'].includes(selectionLevel)">
      <select class="select select-bordered w-full bg-white dark:bg-gray-800 focus:ring-2 focus:ring-green-500"
              [ngModel]="selectedUpazilaId()" (ngModelChange)="onUpazilaChange($event)" [disabled]="isDisabled() || !selectedDistrictId()">
        <option value="" disabled selected>Select Upazila</option>
        <option *ngFor="let u of upazilas()" [value]="u.id">{{ u.name }}</option>
      </select>
    </div>

    <!-- Union -->
    <div class="form-control w-full" *ngIf="['union', 'village'].includes(selectionLevel)">
      <select class="select select-bordered w-full bg-white dark:bg-gray-800 focus:ring-2 focus:ring-green-500"
              [ngModel]="selectedUnionId()" (ngModelChange)="onUnionChange($event)" [disabled]="isDisabled() || !selectedUpazilaId()">
        <option value="" disabled selected>Select Union</option>
        <option *ngFor="let u of unions()" [value]="u.id">{{ u.name }}</option>
      </select>
    </div>

    <!-- Village -->
    <div class="form-control w-full" *ngIf="['village'].includes(selectionLevel)">
      <select class="select select-bordered w-full bg-white dark:bg-gray-800 focus:ring-2 focus:ring-green-500"
              [ngModel]="selectedVillageId()" (ngModelChange)="onVillageChange($event)" [disabled]="isDisabled() || !selectedUnionId()">
        <option value="" disabled selected>Select Village</option>
        <option *ngFor="let v of villages()" [value]="v.id">{{ v.name }}</option>
      </select>
    </div>
  </div>
</div>
