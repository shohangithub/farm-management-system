<div class="flex flex-col items-center justify-center p-12 text-center bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-700">
  <div class="h-16 w-16 bg-gray-50 dark:bg-gray-900 rounded-full flex items-center justify-center mb-4">
    <mat-icon class="text-3xl text-gray-400 dark:text-gray-500">{{ icon }}</mat-icon>
  </div>
  <h3 class="text-lg font-medium text-gray-900 dark:text-white">{{ title }}</h3>
  <p class="mt-1 text-sm text-gray-500 dark:text-gray-400 max-w-sm">{{ description }}</p>
  <div class="mt-6" *ngIf="actionLabel">
    <button mat-stroked-button color="primary" (click)="onAction()">
      <mat-icon class="mr-2">add</mat-icon>
      {{ actionLabel }}
    </button>
  </div>
</div>
