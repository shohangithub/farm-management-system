<div class="relative isolate overflow-hidden rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-900"
  [style.height]="cssHeight()">
  <div #mapEl class="absolute inset-0 z-0" tabindex="0" role="region" [attr.aria-label]="ariaLabel()"></div>

  @if (!ready() && !failed()) {
    <div class="absolute inset-0 z-[1] flex items-center justify-center text-xs text-gray-500 dark:text-gray-400 animate-pulse pointer-events-none">
      {{ 'Loading map…' | t }}
    </div>
  }
  @if (failed()) {
    <div class="absolute inset-0 z-[1] flex items-center justify-center p-4 text-center text-xs text-gray-500 dark:text-gray-400">
      {{ 'The map could not be loaded. Check the internet connection.' | t }}
    </div>
  }

  <!-- Street / Satellite switch -->
  <div class="absolute top-2.5 right-2.5 z-[1000] inline-flex rounded-lg overflow-hidden shadow-md ring-1 ring-black/10 dark:ring-white/10 bg-white dark:bg-gray-800"
    role="group" [attr.aria-label]="'Map type' | t">
    <button type="button" (click)="setLayer('street')" [attr.aria-pressed]="layer() === 'street'"
      class="px-3 h-8 text-xs font-semibold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-500"
      [class]="layer() === 'street' ? 'bg-primary-600 text-white' : 'text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700'">
      {{ 'Street' | t }}
    </button>
    <button type="button" (click)="setLayer('satellite')" [attr.aria-pressed]="layer() === 'satellite'"
      class="px-3 h-8 text-xs font-semibold border-l border-gray-200 dark:border-gray-700 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-500"
      [class]="layer() === 'satellite' ? 'bg-primary-600 text-white' : 'text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700'">
      {{ 'Satellite' | t }}
    </button>
  </div>

  <!-- Overlays from the page (e.g. a weather badge), placed by the caller -->
  <ng-content />
</div>

<div class="mt-2 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 text-xs">
  @if (editable()) {
    <p class="m-0 text-gray-500 dark:text-gray-400">{{ 'Click the map or drag the pin to set the location.' | t }}</p>
  }
  @if (hasPoint()) {
    <a [href]="googleMapsUrl()" target="_blank" rel="noopener"
      class="ml-auto inline-flex items-center gap-1 font-semibold text-primary-700 dark:text-primary-300 hover:underline">
      <span class="material-icons text-[15px]" aria-hidden="true">open_in_new</span>
      {{ 'Open in Google Maps' | t }}
    </a>
  }
</div>
