<div [ngClass]="{'absolute inset-0 bg-white/75 dark:bg-gray-900/75 z-50 flex-col': overlay, 'py-12': !overlay}" 
     class="flex items-center justify-center">
  <mat-spinner diameter="40" color="primary"></mat-spinner>
  <p *ngIf="message" class="mt-4 text-sm font-medium text-gray-500 dark:text-gray-400">{{ message }}</p>
</div>
