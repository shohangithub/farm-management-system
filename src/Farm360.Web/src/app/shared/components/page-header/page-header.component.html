<div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
  <div>
    <app-breadcrumb></app-breadcrumb>
    <h1 class="text-[22px] font-bold text-gray-900 dark:text-white mt-1 tracking-tight leading-tight">
      {{ title }}
    </h1>
    <p *ngIf="description" class="text-[13px] text-gray-500 dark:text-gray-400 mt-1">
      {{ description }}
    </p>
  </div>
  
  <div *ngIf="primaryActionLabel" class="flex items-center gap-2">
    <button mat-flat-button color="primary" (click)="onPrimaryAction()" class="!bg-primary-600 !text-white hover:!bg-primary-700 !rounded-md shadow-sm !font-semibold">
      <mat-icon *ngIf="primaryActionIcon" class="mr-2">{{ primaryActionIcon }}</mat-icon>
      {{ primaryActionLabel }}
    </button>
  </div>
</div>
