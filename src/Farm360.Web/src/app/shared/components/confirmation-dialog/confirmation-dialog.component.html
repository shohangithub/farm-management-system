<h2 mat-dialog-title class="!text-xl !font-bold !text-gray-900 dark:!text-white">
  {{ data.title }}
</h2>
<mat-dialog-content class="!text-gray-600 dark:!text-gray-300">
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end" class="!pb-4 !pr-4">
  <button mat-button (click)="onCancel()" class="!text-gray-600 dark:!text-gray-400 hover:!bg-gray-100 dark:hover:!bg-gray-800">
    {{ data.cancelButtonText || 'Cancel' }}
  </button>
  <button mat-flat-button 
          [color]="data.isDestructive ? 'warn' : 'primary'" 
          (click)="onConfirm()"
          [class.!bg-red-600]="data.isDestructive"
          [class.!bg-primary-600]="!data.isDestructive"
          class="!text-white ml-2 shadow-sm !rounded-md">
    {{ data.confirmButtonText || 'Confirm' }}
  </button>
</mat-dialog-actions>
