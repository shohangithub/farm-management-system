<app-page-header
  [title]="'Vaccinations' | t"
  [description]="'Vaccines due in the next 30 days, overdue first.' | t">
  <div actions class="flex flex-wrap items-center gap-2">
    @if (upcomingVaccinations().length) {
      <button type="button" (click)="exportPdf()" [disabled]="isExporting()"
        class="inline-flex items-center gap-1.5 h-10 px-4 text-sm font-semibold rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors disabled:opacity-50">
        <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">{{ isExporting() ? 'hourglass_empty' : 'download' }}</mat-icon>
        {{ (isExporting() ? 'Preparing PDF...' : 'Download PDF') | t }}
      </button>
    }
    <button type="button" (click)="openRecordVaccinationDialog()"
      class="inline-flex items-center gap-1.5 h-10 px-4 text-sm font-semibold rounded-xl bg-primary-600 hover:bg-primary-700 text-white shadow-sm transition-colors">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">add</mat-icon> {{ 'Record Vaccination' | t }}
    </button>
  </div>
</app-page-header>

<app-health-nav></app-health-nav>

<app-health-filter-bar
  [placeholder]="'Search vaccine or tag'"
  [options]="whenOptions"
  [selected]="whenFilter()"
  (selectedChange)="whenFilter.set($event)"
  (searchChange)="search.set($event)">
</app-health-filter-bar>

<div class="relative min-h-[200px]">
  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>
  <app-error-state *ngIf="error()" class="block" [message]="error()" (retry)="retryLoad()"></app-error-state>

  <div *ngIf="!isLoading() && !error() && visible().length === 0">
    <app-empty-state
      icon="health_and_safety"
      [title]="(upcomingVaccinations().length ? 'Nothing matches this filter' : 'No vaccines due') | t"
      [description]="(upcomingVaccinations().length ? 'Try another word or filter.' : 'No vaccine is due in the next 30 days.') | t"
      [actionLabel]="upcomingVaccinations().length ? undefined : ('Record Vaccination' | t)"
      (action)="openRecordVaccinationDialog()">
    </app-empty-state>
  </div>

  <div #reportSheet id="vaccinationDueListSheet" *ngIf="!error() && !isLoading() && visible().length > 0"
       class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
    <div *ngFor="let ev of visible()"
         class="bg-white dark:bg-gray-800/80 rounded-2xl border shadow-sm flex flex-col min-w-0"
         [ngClass]="getUrgencyClass(ev.scheduledDate) === 'danger-row'
           ? 'border-rose-200 dark:border-rose-800/60'
           : 'border-gray-200/70 dark:border-gray-700/60'">
      <div class="p-4 flex items-start gap-3">
        <div class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">
          <mat-icon class="!w-5 !h-5 !text-[20px]">vaccines</mat-icon>
        </div>
        <div class="min-w-0 flex-1">
          <h3 class="font-semibold text-[15px] leading-snug text-gray-900 dark:text-white break-words">{{ ev.vaccineName }}</h3>
          <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400 inline-flex items-center gap-1">
            <mat-icon class="!text-[14px] !w-[14px] !h-[14px]">pets</mat-icon>{{ tags()[ev.animalId] || (ev.animalId | slice:0:8) }}
          </p>
        </div>
        <span class="shrink-0 inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold"
              [ngClass]="{
                'bg-rose-50 text-rose-700 dark:bg-rose-500/10 dark:text-rose-300': getUrgencyClass(ev.scheduledDate) === 'danger-row',
                'bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-300': getUrgencyClass(ev.scheduledDate) === 'warning-row',
                'bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-300': getUrgencyClass(ev.scheduledDate) === 'info-row',
                'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300': getUrgencyClass(ev.scheduledDate) === ''
              }">
          {{ urgencyLabel(ev.scheduledDate) | t }}
        </span>
      </div>

      <dl class="px-4 pb-4 grid grid-cols-2 gap-x-3 gap-y-3 text-sm">
        <div>
          <dt class="text-[11px] font-medium text-gray-500 dark:text-gray-400">{{ 'Due Date' | t }}</dt>
          <dd class="font-semibold"
              [ngClass]="getUrgencyClass(ev.scheduledDate) === 'danger-row' ? 'text-rose-700 dark:text-rose-300' : 'text-gray-900 dark:text-white'">
            {{ ev.scheduledDate | date:'mediumDate' }}
          </dd>
        </div>
        <div>
          <dt class="text-[11px] font-medium text-gray-500 dark:text-gray-400">{{ 'Batch No' | t }}</dt>
          <dd class="font-semibold text-gray-900 dark:text-white">{{ ev.batchNumber || '—' }}</dd>
        </div>
      </dl>

      <div class="mt-auto px-4 py-3 border-t border-gray-100 dark:border-gray-700/60 flex gap-2 no-print">
        <button type="button" (click)="administer(ev.id)"
          class="flex-1 inline-flex items-center justify-center gap-1 h-10 px-3 text-[13px] font-semibold rounded-lg border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 bg-white dark:bg-gray-800 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 transition-colors">
          <mat-icon class="!text-[16px] !w-[16px] !h-[16px]">check_circle</mat-icon> {{ 'Mark as given today' | t }}
        </button>
      </div>
    </div>
  </div>
</div>
