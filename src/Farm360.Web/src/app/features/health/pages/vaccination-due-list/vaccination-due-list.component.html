<app-page-header 
  title="Due Vaccinations" 
  description="Manage upcoming and overdue vaccinations for your herd."
  icon="vaccines" 
  iconColor="text-blue-600">
  <div actions class="flex gap-2">
    <button (click)="openRecordVaccinationDialog()" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm flex items-center gap-1.5">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">add</mat-icon> Record Vaccination
    </button>
    <button class="px-4 py-2 text-sm font-semibold text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg transition-colors shadow-sm flex items-center gap-1.5" routerLink="../vaccination-protocols">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">library_books</mat-icon> Protocols
    </button>
  </div>
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative">
  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <div *ngIf="error()" class="bg-red-50 border-l-4 border-red-500 p-4 m-6 rounded-md shadow-sm">
    <div class="flex">
      <mat-icon class="text-red-500 mr-2">error</mat-icon>
      <p class="text-sm text-red-700 font-medium">{{ error() }}</p>
    </div>
  </div>

  <div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" *ngIf="!error() && !isLoading() && upcomingVaccinations().length > 0">
    <div *ngFor="let ev of upcomingVaccinations()" class="group relative bg-white dark:bg-gray-800 rounded-2xl border shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1 flex flex-col"
         [ngClass]="{
           'border-gray-100 dark:border-gray-700': getUrgencyClass(ev.scheduledDate) === '',
           'border-red-200 dark:border-red-800/50 bg-red-50/10 dark:bg-red-900/10': getUrgencyClass(ev.scheduledDate) === 'danger-row',
           'border-amber-200 dark:border-amber-800/50 bg-amber-50/10 dark:bg-amber-900/10': getUrgencyClass(ev.scheduledDate) === 'warning-row',
           'border-blue-200 dark:border-blue-800/50 bg-blue-50/10 dark:bg-blue-900/10': getUrgencyClass(ev.scheduledDate) === 'info-row'
         }">
      <!-- Watermark -->
      <mat-icon class="absolute -right-4 -bottom-4 text-[100px] opacity-[0.03] rotate-[-10deg] pointer-events-none transition-transform duration-500 group-hover:scale-110"
                [ngClass]="{
                  'text-gray-500': getUrgencyClass(ev.scheduledDate) === '',
                  'text-red-500': getUrgencyClass(ev.scheduledDate) === 'danger-row',
                  'text-amber-500': getUrgencyClass(ev.scheduledDate) === 'warning-row',
                  'text-blue-500': getUrgencyClass(ev.scheduledDate) === 'info-row'
                }">health_and_safety</mat-icon>
      
      <!-- Card Header -->
      <div class="p-5 flex items-start justify-between border-b border-gray-50 dark:border-gray-700/50 relative z-10">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-md group-hover:scale-110 transition-transform duration-300"
               [ngClass]="{
                 'bg-gradient-to-br from-gray-400 to-gray-500 text-white shadow-gray-400/20': getUrgencyClass(ev.scheduledDate) === '',
                 'bg-gradient-to-br from-red-500 to-rose-600 text-white shadow-red-500/20': getUrgencyClass(ev.scheduledDate) === 'danger-row',
                 'bg-gradient-to-br from-amber-400 to-orange-500 text-white shadow-amber-500/20': getUrgencyClass(ev.scheduledDate) === 'warning-row',
                 'bg-gradient-to-br from-blue-400 to-indigo-500 text-white shadow-blue-500/20': getUrgencyClass(ev.scheduledDate) === 'info-row'
               }">
            <mat-icon class="!w-5 !h-5 !text-[20px]">vaccines</mat-icon>
          </div>
          <div>
            <h3 class="font-bold text-gray-900 dark:text-white text-lg leading-tight group-hover:text-primary-600 transition-colors">{{ ev.vaccineName }}</h3>
            <span class="inline-flex items-center mt-1 text-xs font-semibold text-gray-500 dark:text-gray-400">
              <mat-icon class="!text-[14px] !w-[14px] !h-[14px] mr-1">pets</mat-icon>
              {{ ev.animalId | slice:0:8 }}
            </span>
          </div>
        </div>
        
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm"
              [ngClass]="{
                'bg-gray-50 text-gray-700 border-gray-200': $any(ev).status === 'Scheduled',
                'bg-emerald-50 text-emerald-700 border-emerald-200': $any(ev).status === 'Completed' || $any(ev).status === 'Administered',
                'bg-red-50 text-red-700 border-red-200': $any(ev).status === 'Overdue' || $any(ev).status === 'Missed',
                'bg-blue-50 text-blue-700 border-blue-200': $any(ev).status === 'Cancelled'
              }">
          {{ ev.status }}
        </span>
      </div>

      <!-- Card Body -->
      <div class="p-5 flex-1 relative z-10 flex flex-col justify-center">
        <div class="grid grid-cols-2 gap-y-4 gap-x-2">
          <div>
            <div class="text-[10px] uppercase tracking-wider font-bold text-gray-400 mb-0.5">Due Date</div>
            <div class="text-sm font-bold"
                 [ngClass]="{
                   'text-gray-900 dark:text-white': getUrgencyClass(ev.scheduledDate) === '',
                   'text-red-600 dark:text-red-400': getUrgencyClass(ev.scheduledDate) === 'danger-row',
                   'text-amber-600 dark:text-amber-400': getUrgencyClass(ev.scheduledDate) === 'warning-row',
                   'text-blue-600 dark:text-blue-400': getUrgencyClass(ev.scheduledDate) === 'info-row'
                 }">
              {{ ev.scheduledDate | date:'mediumDate' }}
            </div>
            <div class="text-[10px] uppercase tracking-wider font-bold mt-1"
                 *ngIf="getUrgencyClass(ev.scheduledDate) === 'danger-row'" class="text-red-500 text-xs font-semibold">Overdue!</div>
            <div class="text-[10px] uppercase tracking-wider font-bold mt-1"
                 *ngIf="getUrgencyClass(ev.scheduledDate) === 'warning-row'" class="text-amber-500 text-xs font-semibold">Due Today!</div>
          </div>
          
          <div>
            <div class="text-[10px] uppercase tracking-wider font-bold text-gray-400 mb-0.5">Batch No</div>
            <div class="text-sm font-semibold text-gray-900 dark:text-white">{{ ev.batchNumber || '—' }}</div>
          </div>
        </div>
      </div>

      <!-- Card Footer Actions -->
      <div class="p-4 bg-gray-50 dark:bg-gray-800/80 border-t border-gray-100 dark:border-gray-700/50 flex gap-2 relative z-10">
        <button class="flex-1 px-4 py-2 text-sm font-semibold text-blue-700 bg-white dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg transition-colors shadow-sm inline-flex items-center justify-center gap-1.5" (click)="administer(ev.id)">
          <mat-icon class="!text-[16px] !w-[16px] !h-[16px]">vaccines</mat-icon> Administer
        </button>
      </div>
    </div>
  </div>
    
  <app-empty-state 
    *ngIf="!isLoading() && !error() && upcomingVaccinations().length === 0"
    icon="health_and_safety"
    title="All vaccinations are up to date!"
    description="Great work keeping your herd healthy. There are no upcoming vaccinations scheduled.">
  </app-empty-state>
</div>
