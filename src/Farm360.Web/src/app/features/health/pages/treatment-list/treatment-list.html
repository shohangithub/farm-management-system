<app-page-header 
  title="Medical Treatments" 
  description="Log and track medication, dosages, and withdrawal periods."
  icon="healing" 
  iconColor="text-purple-600">
  <div actions>
    <button (click)="openLogTreatmentDialog()"
      class="px-4 py-2 text-sm font-semibold text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors shadow-sm flex items-center gap-1.5">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">add</mat-icon> Log Treatment
    </button>
  </div>
</app-page-header>

  <div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative">
    <app-loading *ngIf="isLoading" [overlay]="true"></app-loading>
    <div class="relative overflow-x-auto">

      <table mat-table [dataSource]="dataSource" class="w-full">
        
        <ng-container matColumnDef="animalId">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 uppercase text-xs tracking-wider">Animal ID</th>
          <td mat-cell *matCellDef="let element" class="font-medium text-gray-900"> {{element.animalId | slice:0:8}}... </td>
        </ng-container>

        <ng-container matColumnDef="diagnosis">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 uppercase text-xs tracking-wider">Diagnosis</th>
          <td mat-cell *matCellDef="let element" class="text-gray-700"> {{element.diagnosis}} </td>
        </ng-container>

        <ng-container matColumnDef="medicationName">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 uppercase text-xs tracking-wider">Medication</th>
          <td mat-cell *matCellDef="let element">
            <div>
              <span class="text-gray-900 font-medium">{{element.medicationName}}</span>
              <div class="text-xs text-gray-500">{{element.dosageAmount}} {{element.dosageUnit}}</div>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 uppercase text-xs tracking-wider">Date</th>
          <td mat-cell *matCellDef="let element" class="text-gray-600"> {{element.startDate | date:'mediumDate'}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 uppercase text-xs tracking-wider">Status</th>
          <td mat-cell *matCellDef="let element">
            <mat-chip-set>
              <mat-chip [class.bg-blue-100]="element.status === treatmentStatus.Ongoing" [class.text-blue-800]="element.status === treatmentStatus.Ongoing"
                        [class.bg-green-100]="element.status === treatmentStatus.Completed" [class.text-green-800]="element.status === treatmentStatus.Completed"
                        [class.bg-red-100]="element.status === treatmentStatus.Failed" [class.text-red-800]="element.status === treatmentStatus.Failed"
                        [class.bg-gray-100]="element.status === treatmentStatus.Discontinued" [class.text-gray-800]="element.status === treatmentStatus.Discontinued"
                        class="!text-xs !min-h-0 !py-1">
                {{ element.status }}
              </mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="cost">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 uppercase text-xs tracking-wider">Cost</th>
          <td mat-cell *matCellDef="let element" class="text-gray-900 font-medium">
            ৳ {{element.costBdt | number:'1.2-2'}}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-right font-bold text-gray-700 uppercase text-xs tracking-wider">Actions</th>
          <td mat-cell *matCellDef="let element" class="text-right space-x-2">
            <button mat-icon-button [matMenuTriggerFor]="menu" *ngIf="element.status === treatmentStatus.Ongoing">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="updateStatus(element, treatmentStatus.Completed)">
                <mat-icon class="text-green-600">check_circle</mat-icon>
                <span>Mark Completed</span>
              </button>
              <button mat-menu-item (click)="updateStatus(element, treatmentStatus.Failed)">
                <mat-icon class="text-red-600">cancel</mat-icon>
                <span>Mark Failed</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50 border-b border-gray-100"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors border-b border-gray-50"></tr>
      </table>

      <!-- Empty State -->
      <app-empty-state 
        *ngIf="!isLoading && dataSource.length === 0"
        icon="medical_services"
        title="No treatments found"
        message="Log a new treatment to start tracking animal health."
        actionLabel="Log Treatment"
        (action)="openLogTreatmentDialog()">
      </app-empty-state>
    </div>

    <div class="border-t border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30">
      <mat-paginator [length]="totalItems"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="[5, 10, 25, 100]"
                     [pageIndex]="pageIndex"
                     (page)="onPageChange($event)"
                     aria-label="Select page"
                     class="!bg-transparent">
      </mat-paginator>
    </div>
  </div>
