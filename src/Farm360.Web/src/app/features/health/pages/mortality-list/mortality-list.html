<app-page-header 
  title="Mortality Records" 
  description="Log and analyze animal losses for health monitoring."
  icon="sentiment_very_dissatisfied" 
  iconColor="text-gray-800">
  <div actions class="flex gap-2">
    <button (click)="openRecordMortalityDialog()"
      class="px-4 py-2 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors shadow-sm flex items-center gap-1.5">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">warning</mat-icon> Record Mortality
    </button>
  </div>
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative">
  <app-loading *ngIf="isLoading" [overlay]="true"></app-loading>

  <div class="relative overflow-x-auto">
    <table class="w-full text-sm text-left" *ngIf="dataSource.length > 0">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-100 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700 font-bold tracking-wider">
        <tr>
          <th scope="col" class="px-6 py-4">Animal ID</th>
          <th scope="col" class="px-6 py-4">Date</th>
          <th scope="col" class="px-6 py-4">Cause</th>
          <th scope="col" class="px-6 py-4">Disease</th>
          <th scope="col" class="px-6 py-4">Economic Loss</th>
          <th scope="col" class="px-6 py-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let element of dataSource" class="border-b border-gray-50 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
          <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">
            {{ element.animalId | slice:0:8 }}...
          </td>
          <td class="px-6 py-4 text-gray-600 dark:text-gray-400">
            {{ element.deathDate | date:'mediumDate' }}
          </td>
          <td class="px-6 py-4">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 dark:bg-gray-800 dark:text-gray-300 border border-gray-200 dark:border-gray-700">
              {{ element.causeOfDeath }}
            </span>
          </td>
          <td class="px-6 py-4 text-gray-700 dark:text-gray-300">
            {{ element.diseaseName || '-' }}
          </td>
          <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">
            <span *ngIf="element.estimatedEconomicLossBdt">৳ {{ element.estimatedEconomicLossBdt | number:'1.0-0' }}</span>
            <span *ngIf="!element.estimatedEconomicLossBdt" class="text-gray-400">-</span>
          </td>
          <td class="px-6 py-4 text-right space-x-2">
            <button mat-icon-button color="primary" matTooltip="View Details">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <app-empty-state 
      *ngIf="!isLoading && dataSource.length === 0"
      icon="sentiment_very_dissatisfied"
      title="No mortality records"
      description="Log animal losses for your records and analysis."
      actionLabel="Record Mortality"
      (action)="openRecordMortalityDialog()">
    </app-empty-state>
  </div>

  <div class="border-t border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30">
    <mat-paginator [length]="totalItems"
                   [pageSize]="pageSize"
                   [pageSizeOptions]="[5, 10, 25, 100]"
                   [pageIndex]="pageIndex"
                   (page)="onPageChange($event)"
                   aria-label="Select page"
                   class="!bg-transparent">
    </mat-paginator>
  </div>
</div>
