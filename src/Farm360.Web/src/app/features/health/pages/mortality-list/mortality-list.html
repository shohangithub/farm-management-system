<app-page-header 
  title="Mortality Records" 
  description="Log and analyze animal losses for health monitoring."
  icon="sentiment_very_dissatisfied" 
  iconColor="text-gray-800">
  <div actions class="flex gap-2">
    <button (click)="openRecordMortalityDialog()"
      class="px-4 py-2 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors shadow-sm flex items-center gap-1.5">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">warning</mat-icon> Record Mortality
    </button>
  </div>
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative">
  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" *ngIf="!isLoading() && dataSource().length > 0">
    <div *ngFor="let element of dataSource()" class="group relative bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1 flex flex-col">
      <!-- Watermark -->
      <mat-icon class="absolute -right-4 -bottom-4 text-[100px] text-gray-500/5 dark:text-gray-400/5 rotate-[-10deg] pointer-events-none transition-transform duration-500 group-hover:scale-110">sentiment_very_dissatisfied</mat-icon>
      
      <!-- Card Header -->
      <div class="p-5 flex items-start justify-between border-b border-gray-50 dark:border-gray-700/50 relative z-10">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-md bg-gradient-to-br from-gray-600 to-gray-800 text-white shadow-gray-600/20 group-hover:scale-110 transition-transform duration-300">
            <mat-icon class="!w-5 !h-5 !text-[20px]">sentiment_very_dissatisfied</mat-icon>
          </div>
          <div>
            <h3 class="font-bold text-gray-900 dark:text-white text-lg leading-tight group-hover:text-gray-600 transition-colors">{{ getCauseName(element.causeOfDeath) }}</h3>
            <span class="inline-flex items-center mt-1 text-xs font-semibold text-gray-500 dark:text-gray-400">
              <mat-icon class="!text-[14px] !w-[14px] !h-[14px] mr-1">pets</mat-icon>
              {{ element.animalId | slice:0:8 }}
            </span>
          </div>
        </div>
      </div>

      <!-- Card Body -->
      <div class="p-5 flex-1 relative z-10 flex flex-col justify-center">
        <div class="mb-4" *ngIf="element.diseaseName">
          <div class="text-[10px] uppercase tracking-wider font-bold text-gray-400 mb-1">Disease</div>
          <p class="text-sm font-semibold text-red-600 dark:text-red-400">{{ element.diseaseName }}</p>
        </div>

        <div class="grid grid-cols-2 gap-y-4 gap-x-2 border-t border-gray-100 dark:border-gray-700/50 pt-4 mt-auto">
          <div>
            <div class="text-[10px] uppercase tracking-wider font-bold text-gray-400 mb-0.5">Economic Loss</div>
            <div class="text-sm font-bold text-red-600 dark:text-red-400">
              <span *ngIf="element.estimatedEconomicLossBdt">৳ {{ element.estimatedEconomicLossBdt | number:'1.0-0' }}</span>
              <span *ngIf="!element.estimatedEconomicLossBdt" class="text-gray-400 font-medium">—</span>
            </div>
          </div>
          
          <div>
            <div class="text-[10px] uppercase tracking-wider font-bold text-gray-400 mb-0.5">Date</div>
            <div class="text-sm font-semibold text-gray-900 dark:text-white">
              {{ element.deathDate | date:'mediumDate' }}
            </div>
          </div>
        </div>
      </div>

      <!-- Card Footer Actions -->
      <div class="p-4 bg-gray-50 dark:bg-gray-800/80 border-t border-gray-100 dark:border-gray-700/50 flex gap-2 relative z-10">
        <button (click)="viewDetails(element)" class="flex-1 px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg transition-colors shadow-sm inline-flex items-center justify-center gap-1.5">
          <mat-icon class="!text-[16px] !w-[16px] !h-[16px]">visibility</mat-icon> View Details
        </button>
      </div>
    </div>
  </div>

    <app-empty-state 
      *ngIf="!isLoading() && dataSource().length === 0"
      icon="sentiment_very_dissatisfied"
      title="No mortality records"
      description="Log animal losses for your records and analysis."
      actionLabel="Record Mortality"
      (action)="openRecordMortalityDialog()">
    </app-empty-state>

  <div class="border-t border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30">
    <mat-paginator [length]="totalItems()"
                   [pageSize]="pageSize()"
                   [pageSizeOptions]="[5, 10, 25, 100]"
                   [pageIndex]="pageIndex()"
                   (page)="onPageChange($event)"
                   aria-label="Select page"
                   class="!bg-transparent">
    </mat-paginator>
  </div>
</div>
