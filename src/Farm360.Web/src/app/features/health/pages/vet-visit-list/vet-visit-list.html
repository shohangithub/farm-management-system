<app-page-header 
  title="Veterinary Visits" 
  description="Log and manage professional vet visits, costs, and recommendations."
  icon="local_hospital" 
  iconColor="text-teal-600">
  <div actions class="flex gap-2">
    <button (click)="openScheduleVisitDialog()" class="px-4 py-2 text-sm font-semibold text-white bg-teal-600 hover:bg-teal-700 rounded-lg transition-colors shadow-sm flex items-center gap-1.5">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">add</mat-icon> Log Visit
    </button>
  </div>
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative">
  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <div class="relative overflow-x-auto">
    <table class="w-full text-sm text-left" *ngIf="dataSource().length > 0">
      <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-100 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700 font-bold tracking-wider">
        <tr>
          <th scope="col" class="px-6 py-4">Date</th>
          <th scope="col" class="px-6 py-4">Vet Name</th>
          <th scope="col" class="px-6 py-4">Type</th>
          <th scope="col" class="px-6 py-4">Purpose</th>
          <th scope="col" class="px-6 py-4">Cost</th>
          <th scope="col" class="px-6 py-4">Next Visit</th>
          <th scope="col" class="px-6 py-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let element of dataSource()" class="border-b border-gray-50 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
          <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">
            {{ element.visitDate | date:'mediumDate' }}
          </td>
          <td class="px-6 py-4 text-gray-700 dark:text-gray-300">
            {{ element.vetName }}
          </td>
          <td class="px-6 py-4">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" 
                  [ngClass]="{
                    'bg-teal-100 text-teal-800 dark:bg-teal-900/30 dark:text-teal-400': element.visitType === 'Routine',
                    'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400': element.visitType === 'Emergency',
                    'bg-indigo-100 text-indigo-800 dark:bg-indigo-900/30 dark:text-indigo-400': element.visitType === 'FollowUp'
                  }">
              {{ element.visitType }}
            </span>
          </td>
          <td class="px-6 py-4 text-gray-600 dark:text-gray-400 truncate max-w-[200px]" [matTooltip]="element.purpose">
            {{ element.purpose || '-' }}
          </td>
          <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">
            <span *ngIf="element.costBdt">৳ {{ element.costBdt | number:'1.2-2' }}</span>
            <span *ngIf="!element.costBdt" class="text-gray-400">-</span>
          </td>
          <td class="px-6 py-4 text-gray-600 dark:text-gray-400">
            <span *ngIf="element.nextVisitDate">{{ element.nextVisitDate | date:'mediumDate' }}</span>
            <span *ngIf="!element.nextVisitDate" class="text-gray-400">-</span>
          </td>
          <td class="px-6 py-4 text-right space-x-2">
            <button mat-icon-button color="primary" matTooltip="View Details">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <app-empty-state 
      *ngIf="!isLoading() && dataSource().length === 0"
      icon="local_hospital"
      title="No veterinary visits found"
      description="Log professional vet visits to track your farm's health history."
      actionLabel="Log Visit"
      (action)="openScheduleVisitDialog()">
    </app-empty-state>
  </div>

  <div class="border-t border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30">
    <mat-paginator [length]="totalItems()"
                   [pageSize]="pageSize()"
                   [pageSizeOptions]="[5, 10, 25, 100]"
                   [pageIndex]="pageIndex()"
                   (page)="onPageChange($event)"
                   aria-label="Select page"
                   class="!bg-transparent">
    </mat-paginator>
  </div>
</div>
