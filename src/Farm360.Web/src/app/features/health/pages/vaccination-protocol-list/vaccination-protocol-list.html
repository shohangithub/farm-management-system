<app-page-header 
  title="Vaccination Protocols" 
  description="Manage standardized vaccination regimens for different animal species."
  icon="library_books" 
  iconColor="text-blue-600">
  <div actions class="flex gap-2">
    <button (click)="openCreateDialog()" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm flex items-center gap-1.5">
      <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">add</mat-icon> Create Protocol
    </button>
  </div>
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative min-h-[400px]">
  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <!-- Empty State -->
  <app-empty-state 
    *ngIf="!isLoading() && (!dataSource() || dataSource().length === 0)"
    icon="library_books"
    title="No vaccination protocols found"
    description="Create a protocol to establish standard vaccination schedules."
    actionLabel="Create Protocol"
    (action)="openCreateDialog()">
  </app-empty-state>

  <!-- Beautiful List Design -->
  <div class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" *ngIf="!isLoading() && dataSource() && dataSource().length > 0">
    <div *ngFor="let element of dataSource()" class="group relative bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1 flex flex-col">
      <!-- Watermark -->
      <mat-icon class="absolute -right-4 -bottom-4 text-[100px] text-blue-500/5 dark:text-blue-400/5 rotate-[-10deg] pointer-events-none transition-transform duration-500 group-hover:scale-110">security</mat-icon>
      
      <!-- Card Header -->
      <div class="p-5 flex items-start justify-between border-b border-gray-50 dark:border-gray-700/50 relative z-10">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20 group-hover:scale-110 transition-transform duration-300">
            <mat-icon class="!w-5 !h-5 !text-[20px]">vaccines</mat-icon>
          </div>
          <div>
            <h3 class="font-bold text-gray-900 dark:text-white text-lg leading-tight group-hover:text-blue-600 transition-colors">{{ element.title }}</h3>
            <span class="inline-flex items-center px-2 py-0.5 mt-1 rounded text-[10px] font-bold uppercase tracking-wider bg-indigo-50 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-800">
              {{ element.targetSpecies }}
            </span>
            <span *ngIf="element.isDeworming" class="inline-flex items-center px-2 py-0.5 mt-1 ml-2 rounded text-[10px] font-bold uppercase tracking-wider bg-orange-50 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400 border border-orange-100 dark:border-orange-800">
              🐛 Deworming
            </span>
          </div>
        </div>
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold" 
              [ngClass]="element.isActive ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-gray-100 text-gray-600 border border-gray-200'">
          {{ element.isActive ? 'Active' : 'Inactive' }}
        </span>
      </div>

      <!-- Card Body -->
      <div class="p-5 flex-1 relative z-10 flex flex-col justify-center">
        <div class="flex items-center justify-center py-4">
          <div class="text-center">
            <div class="text-3xl font-black text-gray-900 dark:text-white group-hover:text-blue-600 transition-colors">{{ element.steps ? element.steps.length : 0 }}</div>
            <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mt-1">Required Doses</div>
          </div>
        </div>
      </div>

      <!-- Card Footer Actions -->
      <div class="p-4 bg-gray-50 dark:bg-gray-800/80 border-t border-gray-100 dark:border-gray-700/50 flex gap-2 relative z-10">
        <button class="flex-1 px-4 py-2 text-sm font-semibold text-blue-700 bg-white dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg transition-colors shadow-sm inline-flex items-center justify-center gap-1.5" (click)="openAssignDialog(element)">
          <mat-icon class="!text-[16px] !w-[16px] !h-[16px]">group_add</mat-icon> Assign
        </button>
        <button (click)="openEditDialog(element)" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors border border-transparent hover:border-blue-200 dark:hover:border-blue-800 bg-white dark:bg-gray-800 shadow-sm" matTooltip="Edit Protocol">
          <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">edit</mat-icon>
        </button>
        <button [routerLink]="['./', element.id]" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors border border-transparent hover:border-blue-200 dark:hover:border-blue-800 bg-white dark:bg-gray-800 shadow-sm" matTooltip="View Details">
          <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">visibility</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="border-t border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30" *ngIf="totalItems() > pageSize()">
    <mat-paginator [length]="totalItems()"
                   [pageSize]="pageSize()"
                   [pageSizeOptions]="[5, 10, 25, 100]"
                   [pageIndex]="pageIndex()"
                   (page)="onPageChange($event)"
                   aria-label="Select page"
                   class="!bg-transparent">
    </mat-paginator>
  </div>
</div>
