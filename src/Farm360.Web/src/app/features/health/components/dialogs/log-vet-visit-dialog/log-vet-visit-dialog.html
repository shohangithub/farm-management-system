<div class="flex flex-col h-full max-h-[90vh] bg-white dark:bg-gray-900 rounded-xl overflow-hidden shadow-2xl">
  <!-- Header -->
  <div
    class="px-6 py-4 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center bg-gray-50/50 dark:bg-gray-800/50 relative overflow-hidden">
    <!-- Decorative Watermark -->
    <mat-icon
      class="absolute -right-2 -bottom-2 text-[80px] text-teal-500/5 dark:text-teal-400/5 rotate-[-15deg] pointer-events-none">local_hospital</mat-icon>

    <div class="flex items-center gap-3 relative z-10">
      <div class="bg-teal-100 dark:bg-teal-900/50 text-teal-600 dark:text-teal-400 p-2 rounded-lg shadow-sm">
        <mat-icon>local_hospital</mat-icon>
      </div>
      <div>
        <h2 class="text-xl font-bold text-gray-900 dark:text-white m-0 leading-tight">Log Veterinary Visit</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 m-0 mt-0.5">Record a professional consultation</p>
      </div>
    </div>
    <button mat-icon-button (click)="cancel()"
      class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 relative z-10">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col flex-1 overflow-hidden">
    <div class="flex-1 overflow-y-auto px-6 py-5 custom-scrollbar">
      <div class="flex flex-col gap-5">

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Target Farm <span
              class="text-red-500">*</span></label>
          <select formControlName="farmId"
            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
            <option [ngValue]="null" disabled>-- Select a Farm --</option>
            <option *ngFor="let farm of farms$ | async" [value]="farm.id">
              {{ farm.name }}
            </option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Veterinarian Name <span
                class="text-red-500">*</span></label>
            <input type="text" formControlName="vetName" placeholder="Dr. John Doe"
              class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Visit Date <span
                class="text-red-500">*</span></label>
            <input type="date" formControlName="visitDate"
              class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Visit Type <span
              class="text-red-500">*</span></label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <label
              class="relative flex flex-col items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors"
              [ngClass]="form.get('visitType')?.value == 1 ? 'border-teal-500 bg-teal-50 dark:bg-teal-900/20' : 'border-gray-200 dark:border-gray-700'">
              <input type="radio" formControlName="visitType" [value]="1" class="sr-only">
              <mat-icon class="!text-[28px] !w-[28px] !h-[28px] mb-1"
                [ngClass]="form.get('visitType')?.value == 1 ? 'text-teal-600' : 'text-gray-400'">health_and_safety</mat-icon>
              <span class="text-xs font-bold text-center"
                [ngClass]="form.get('visitType')?.value == 1 ? 'text-teal-700' : 'text-gray-500'">Routine Checkup</span>
            </label>

            <label
              class="relative flex flex-col items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors"
              [ngClass]="form.get('visitType')?.value == 2 ? 'border-red-500 bg-red-50 dark:bg-red-900/20' : 'border-gray-200 dark:border-gray-700'">
              <input type="radio" formControlName="visitType" [value]="2" class="sr-only">
              <mat-icon class="!text-[28px] !w-[28px] !h-[28px] mb-1"
                [ngClass]="form.get('visitType')?.value == 2 ? 'text-red-600' : 'text-gray-400'">emergency</mat-icon>
              <span class="text-xs font-bold text-center"
                [ngClass]="form.get('visitType')?.value == 2 ? 'text-red-700' : 'text-gray-500'">Emergency</span>
            </label>

            <label
              class="relative flex flex-col items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors"
              [ngClass]="form.get('visitType')?.value == 3 ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/20' : 'border-gray-200 dark:border-gray-700'">
              <input type="radio" formControlName="visitType" [value]="3" class="sr-only">
              <mat-icon class="!text-[28px] !w-[28px] !h-[28px] mb-1"
                [ngClass]="form.get('visitType')?.value == 3 ? 'text-blue-600' : 'text-gray-400'">vaccines</mat-icon>
              <span class="text-xs font-bold text-center"
                [ngClass]="form.get('visitType')?.value == 3 ? 'text-blue-700' : 'text-gray-500'">Vaccination</span>
            </label>

            <label
              class="relative flex flex-col items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors"
              [ngClass]="form.get('visitType')?.value == 4 ? 'border-purple-500 bg-purple-50 dark:bg-purple-900/20' : 'border-gray-200 dark:border-gray-700'">
              <input type="radio" formControlName="visitType" [value]="4" class="sr-only">
              <mat-icon class="!text-[28px] !w-[28px] !h-[28px] mb-1"
                [ngClass]="form.get('visitType')?.value == 4 ? 'text-purple-600' : 'text-gray-400'">content_cut</mat-icon>
              <span class="text-xs font-bold text-center"
                [ngClass]="form.get('visitType')?.value == 4 ? 'text-purple-700' : 'text-gray-500'">Surgery</span>
            </label>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Purpose</label>
          <input type="text" formControlName="purpose" placeholder="Brief reason for the visit"
            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Findings</label>
          <textarea formControlName="findings" rows="2" placeholder="Clinical observations..."
            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow resize-none"></textarea>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Recommendations</label>
          <textarea formControlName="recommendations" rows="2" placeholder="Vet's advice or treatment plan..."
            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow resize-none"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Total Cost (BDT)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500 font-medium">৳</span>
              <input type="number" formControlName="costBdt" min="0" placeholder="0"
                class="block w-full pl-8 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
            </div>
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Next Visit Date</label>
            <input type="date" formControlName="nextVisitDate"
              class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
          </div>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div
      class="px-6 py-4 bg-gray-50 dark:bg-gray-800/80 border-t border-gray-100 dark:border-gray-800 flex justify-end gap-3 shrink-0">
      <button type="button" (click)="cancel()" [disabled]="isSubmitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
        Cancel
      </button>
      <button type="submit" [disabled]="form.invalid || isSubmitting()"
        class="px-5 py-2 text-sm font-semibold text-white bg-primary-600 rounded-lg hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2 shadow-sm">
        <mat-icon *ngIf="isSubmitting()" class="animate-spin !w-[18px] !h-[18px] !text-[18px]">autorenew</mat-icon>
        <mat-icon *ngIf="!isSubmitting()" class="!w-[18px] !h-[18px] !text-[18px]">save</mat-icon>
        {{ isSubmitting() ? 'Saving...' : 'Save Record' }}
      </button>
    </div>
  </form>
</div>
