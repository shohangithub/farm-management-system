<app-page-header 
  title="My Profile" 
  description="Manage your personal details and account preferences."
  primaryActionLabel="Save Changes"
  primaryActionIcon="save"
  (primaryAction)="onSubmit()">
</app-page-header>

<div class="p-6">
  <div class="max-w-3xl mx-auto bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700/50 overflow-hidden relative">
    
    <div *ngIf="successMessage()" class="m-6 bg-emerald-50 dark:bg-emerald-900/20 border-l-4 border-emerald-500 p-4 rounded-r-md flex items-center shadow-sm">
      <mat-icon class="text-emerald-500 mr-3">check_circle</mat-icon>
      <p class="text-sm font-semibold text-emerald-700 dark:text-emerald-400">{{ successMessage() }}</p>
    </div>

    <div *ngIf="error()" class="m-6 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 p-4 rounded-r-md flex items-center shadow-sm">
      <mat-icon class="text-red-500 mr-3">error_outline</mat-icon>
      <p class="text-sm font-semibold text-red-700 dark:text-red-400">{{ error() }}</p>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="p-6">
      
      <div class="flex items-center gap-6 mb-8 pb-8 border-b border-gray-100 dark:border-gray-700/50">
        <div class="w-24 h-24 rounded-full bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center text-white text-3xl font-bold shadow-lg">
          {{ profileForm.get('name')?.value?.charAt(0) || 'U' }}
        </div>
        <div>
          <h2 class="text-xl font-bold text-gray-900 dark:text-white">{{ profileForm.get('name')?.value || 'User' }}</h2>
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">{{ profileForm.get('role')?.value }}</p>
          <button type="button" class="mt-3 px-4 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 text-xs font-semibold rounded-lg transition-colors">
            Change Avatar
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Full Name</label>
          <input type="text" formControlName="name" class="w-full px-4 py-2.5 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 transition-shadow">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
          <input type="email" formControlName="email" class="w-full px-4 py-2.5 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 transition-shadow">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Phone Number</label>
          <input type="tel" formControlName="phone" class="w-full px-4 py-2.5 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 transition-shadow">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Role (Read Only)</label>
          <input type="text" formControlName="role" class="w-full px-4 py-2.5 border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-gray-800 text-gray-500 cursor-not-allowed">
        </div>
      </div>
      
      <div class="mt-8 flex justify-end">
        <button type="submit" [disabled]="isSaving()" class="px-6 py-2.5 bg-primary-600 hover:bg-primary-500 text-white rounded-lg shadow-sm font-bold flex items-center gap-2 transition-colors disabled:opacity-50">
          <mat-icon *ngIf="isSaving()" class="animate-spin !text-[18px] !w-[18px] !h-[18px]">autorenew</mat-icon>
          <mat-icon *ngIf="!isSaving()" class="!text-[18px] !w-[18px] !h-[18px]">save</mat-icon>
          {{ isSaving() ? 'Saving...' : 'Save Profile' }}
        </button>
      </div>

    </form>
  </div>
</div>
