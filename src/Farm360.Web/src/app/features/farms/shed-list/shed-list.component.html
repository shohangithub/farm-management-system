<app-page-header 
  title="Sheds" 
  description="Manage housing units and physical structures for this farm."
  primaryActionLabel="Add Shed"
  primaryActionIcon="add"
  (primaryAction)="onAddShed()">
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative min-h-[400px]">
  
  <!-- Loading State -->
  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <!-- Filters Bar -->
  <div *ngIf="shedsResult().length > 0 || searchTerm()" class="px-6 py-4 border-b border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30">
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="relative w-full sm:w-96">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <mat-icon class="!text-gray-400 !text-[18px] !w-[18px] !h-[18px]">search</mat-icon>
        </div>
        <input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)"
               class="block w-full pl-10 pr-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-colors" 
               placeholder="Search sheds by name or number...">
      </div>
      
      <div class="w-full sm:w-auto flex items-center gap-3">
        <div class="text-sm font-medium text-gray-500 dark:text-gray-400 whitespace-nowrap">Filter by:</div>
        <div class="relative">
          <select (change)="onFilterStatus($event)" class="block w-44 pl-3 pr-10 py-2 text-base border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-lg shadow-sm appearance-none cursor-pointer">
            <option value="">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="UnderMaintenance">Maintenance</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">expand_more</mat-icon>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State (No Sheds at all) -->
  <app-empty-state 
    *ngIf="!isLoading() && shedsResult().length === 0 && !searchTerm()"
    icon="house_siding"
    title="No Sheds Found"
    description="This farm doesn't have any housing units yet. Create your first shed to start managing animals."
    actionLabel="Add First Shed"
    (action)="onAddShed()">
  </app-empty-state>

  <!-- Empty State (Search Filter) -->
  <app-empty-state 
    *ngIf="!isLoading() && shedsResult().length > 0 && filteredSheds().length === 0"
    icon="search_off"
    title="No matches found"
    description="We couldn't find any sheds matching your search or filters.">
  </app-empty-state>

  <!-- Grid -->
  <div *ngIf="!isLoading() && filteredSheds().length > 0" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let shed of filteredSheds()" class="group relative bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1 flex flex-col h-full">
      
      <!-- Watermark -->
      <mat-icon class="absolute -right-4 -bottom-4 text-[100px] text-amber-500/5 dark:text-amber-400/5 rotate-[-10deg] pointer-events-none transition-transform duration-500 group-hover:scale-110">house_siding</mat-icon>

      <div class="p-5 flex items-start justify-between border-b border-gray-50 dark:border-gray-700/50 relative z-10">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 text-white flex items-center justify-center shadow-md shadow-amber-500/20 group-hover:scale-110 transition-transform duration-300">
            <mat-icon class="!w-5 !h-5 !text-[20px]">house_siding</mat-icon>
          </div>
          <div>
            <h3 class="font-bold text-gray-900 dark:text-white text-lg leading-tight group-hover:text-amber-600 transition-colors tracking-tight">
              <a [routerLink]="['/organizations/branches', branchId(), 'farms', farmId(), 'sheds', shed.id]">{{ shed.shedName }}</a>
            </h3>
            <div class="flex items-center gap-2 mt-1">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600">
                {{ shed.shedNumber }}
              </span>
              <span class="text-[10px] font-bold tracking-wider uppercase flex items-center gap-1 text-gray-500 dark:text-gray-400">
                <mat-icon class="!text-[12px] !w-[12px] !h-[12px]">pets</mat-icon> {{ shed.animalType || 'Mixed' }}
              </span>
            </div>
          </div>
        </div>
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider" 
              [ngClass]="getStatusClass(shed.status)">
          {{ getStatusName(shed.status) }}
        </span>
      </div>
      
      <div class="p-5 flex-1 relative z-10 flex flex-col justify-center">
        <div class="flex justify-between items-end mb-1">
          <span class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Occupancy</span>
          <span class="text-sm font-bold text-gray-900 dark:text-white">{{ shed.currentOccupancy | number }} <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">/ {{ shed.capacity ? (shed.capacity | number) : '∞' }}</span></span>
        </div>
        <div class="w-full bg-gray-100 dark:bg-gray-800 rounded-full h-1.5 overflow-hidden">
          <div class="h-1.5 rounded-full transition-all duration-500" 
               [ngClass]="{'bg-amber-500': (shed.capacity && (shed.currentOccupancy / shed.capacity) < 0.8), 'bg-orange-500': (shed.capacity && (shed.currentOccupancy / shed.capacity) >= 0.8 && (shed.currentOccupancy / shed.capacity) < 1), 'bg-red-500': (shed.capacity && (shed.currentOccupancy / shed.capacity) >= 1)}"
               [style.width]="(shed.capacity ? Math.min((shed.currentOccupancy / shed.capacity) * 100, 100) : 0) + '%'"></div>
        </div>
      </div>
      
      <div class="p-4 bg-gray-50 dark:bg-gray-800/80 border-t border-gray-100 dark:border-gray-700/50 flex gap-2 relative z-10">
        <a [routerLink]="['/organizations/branches', branchId(), 'farms', farmId(), 'sheds', shed.id]" 
           class="flex-1 px-4 py-2 text-sm font-semibold text-amber-700 bg-white dark:bg-gray-800 hover:bg-amber-50 dark:hover:bg-amber-900/30 border border-amber-200 dark:border-amber-800 rounded-lg transition-colors shadow-sm inline-flex items-center justify-center gap-1.5">
          <mat-icon class="!text-[16px] !w-[16px] !h-[16px]">visibility</mat-icon> View
        </a>
        <a [routerLink]="['/organizations/branches', branchId(), 'farms', farmId(), 'sheds', shed.id, 'edit']" 
           class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-amber-600 hover:bg-amber-50 dark:hover:bg-amber-900/30 rounded-lg transition-colors border border-transparent hover:border-amber-200 dark:hover:border-amber-800 bg-white dark:bg-gray-800 shadow-sm"
           title="Edit Shed">
          <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">edit</mat-icon>
        </a>
      </div>
    </div>
  </div>
</div>
