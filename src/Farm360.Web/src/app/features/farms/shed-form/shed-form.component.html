<div class="p-6 max-w-3xl mx-auto">
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ isEditMode ? 'Edit Shed' : 'Register New Shed' }}</h1>
    <p class="text-gray-500 dark:text-gray-400 mt-1">
      {{ isEditMode ? 'Update housing unit details.' : 'Add a new housing unit to the farm.' }}
    </p>
  </div>

  <form [formGroup]="shedForm" (ngSubmit)="onSubmit()" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-6">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Shed Number *</label>
        <input type="text" formControlName="shedNumber" class="form-input" placeholder="e.g. S-01">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Shed Name *</label>
        <input type="text" formControlName="shedName" class="form-input" placeholder="e.g. North Broiler House">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Animal Type</label>
        <input type="text" formControlName="animalType" class="form-input" placeholder="e.g. Broiler, Dairy Cattle">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Capacity</label>
        <input type="number" formControlName="capacity" class="form-input" placeholder="Max animals">
      </div>
    </div>

    <hr class="border-gray-200 dark:border-gray-700">

    <h3 class="text-lg font-bold text-gray-900 dark:text-white">Infrastructure Details</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Floor Type</label>
        <input type="text" formControlName="floorType" class="form-input" placeholder="e.g. Concrete, Slatted">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Roof Type</label>
        <input type="text" formControlName="roofType" class="form-input" placeholder="e.g. Tin, Insulated">
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-gray-50 dark:bg-gray-900/50 p-4 rounded-lg">
      <label class="flex items-center space-x-3 cursor-pointer">
        <input type="checkbox" formControlName="hasVentilation" class="form-checkbox h-5 w-5 text-brand-600 rounded border-gray-300 focus:ring-brand-500">
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Ventilation System</span>
      </label>
      <label class="flex items-center space-x-3 cursor-pointer">
        <input type="checkbox" formControlName="hasWaterLine" class="form-checkbox h-5 w-5 text-brand-600 rounded border-gray-300 focus:ring-brand-500">
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Water Line</span>
      </label>
      <label class="flex items-center space-x-3 cursor-pointer">
        <input type="checkbox" formControlName="hasFeedLine" class="form-checkbox h-5 w-5 text-brand-600 rounded border-gray-300 focus:ring-brand-500">
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Feed Line</span>
      </label>
    </div>

    <div *ngIf="isEditMode">
      <hr class="border-gray-200 dark:border-gray-700 my-6">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
      <select formControlName="status" class="form-input w-full md:w-1/2">
        <option [value]="1">Active</option>
        <option [value]="2">Inactive</option>
        <option [value]="3">Maintenance</option>
      </select>
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700 mt-6">
      <a [routerLink]="['/organizations/branches', branchId, 'farms', farmId]" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700 transition-colors">
        Cancel
      </a>
      <button type="submit" [disabled]="shedForm.invalid || isSaving" class="btn-primary">
        <span *ngIf="isSaving"><i class="fas fa-spinner fa-spin mr-2"></i> Saving...</span>
        <span *ngIf="!isSaving">{{ isEditMode ? 'Update Shed' : 'Create Shed' }}</span>
      </button>
    </div>
  </form>
</div>
