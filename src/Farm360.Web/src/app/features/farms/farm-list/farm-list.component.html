<app-page-header 
  title="Farms" 
  description="Manage all farm locations operating under this branch."
  primaryActionLabel="Add Farm"
  primaryActionIcon="add"
  (primaryAction)="onAddFarm()">
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative min-h-[400px]">
  
  <!-- Loading State -->
  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <!-- Filters Bar (Only show if we have farms at all, or if we're searching) -->
  <div *ngIf="farmsResult().length > 0 || searchTerm()" class="px-6 py-4 border-b border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30">
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="relative w-full sm:w-96">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <mat-icon class="!text-gray-400 !text-[18px] !w-[18px] !h-[18px]">search</mat-icon>
        </div>
        <input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)"
               class="block w-full pl-10 pr-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-colors" 
               placeholder="Search farms by name or code...">
      </div>
      
      <div class="w-full sm:w-auto flex items-center gap-3">
        <div class="text-sm font-medium text-gray-500 dark:text-gray-400 whitespace-nowrap">Filter by:</div>
        <div class="relative">
          <select (change)="onFilterStatus($event)" class="block w-44 pl-3 pr-10 py-2 text-base border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-lg shadow-sm appearance-none cursor-pointer">
            <option value="">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="UnderMaintenance">Under Maintenance</option>
            <option value="Closed">Closed</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">expand_more</mat-icon>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State (No Farms at all) -->
  <app-empty-state 
    *ngIf="!isLoading() && farmsResult().length === 0 && !searchTerm()"
    icon="agriculture"
    title="No Farms Found"
    description="This branch doesn't have any farms yet. Create your first farm to start managing your agricultural operations."
    actionLabel="Add First Farm"
    (action)="onAddFarm()">
  </app-empty-state>

  <!-- Empty State (Search Filter) -->
  <app-empty-state 
    *ngIf="!isLoading() && farmsResult().length > 0 && filteredFarms().length === 0"
    icon="search_off"
    title="No matches found"
    description="We couldn't find any farms matching your search or filters.">
  </app-empty-state>

  <!-- Grid -->
  <div *ngIf="!isLoading() && filteredFarms().length > 0" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <app-farm-card *ngFor="let farm of filteredFarms()" [farm]="farm" [branchId]="branchId()"></app-farm-card>
  </div>
</div>
