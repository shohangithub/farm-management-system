<app-page-header 
  title="Organizations" 
  description="Manage your business entities and branches."
  primaryActionLabel="Add Organization"
  primaryActionIcon="add"
  (primaryAction)="onAdd()">
</app-page-header>

<div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 p-4 rounded-md mb-6 shadow-sm">
  {{ error() }}
</div>

<div *ngIf="isLoading()" class="flex justify-center py-12">
  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600"></div>
</div>

<app-data-table
  *ngIf="!isLoading()"
  [data]="organizations()"
  [columns]="columns"
  [displayedColumns]="displayedColumns"
  (view)="onEdit($event)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)">
</app-data-table>
