<app-page-header 
  title="Organizations" 
  description="Manage your business entities and branches."
  primaryActionLabel="Add Organization"
  primaryActionIcon="add"
  (primaryAction)="onAdd()">
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative min-h-[400px]">
  
  <div *ngIf="error()" class="m-6 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 text-red-600 dark:text-red-400 p-4 rounded-r-md shadow-sm flex items-start gap-3 animate-fade-in-up">
    <mat-icon class="!text-red-500 mt-0.5">error_outline</mat-icon>
    <div>
      <h3 class="text-sm font-semibold">Error</h3>
      <p class="text-xs mt-1">{{ error() }}</p>
    </div>
  </div>

  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <!-- Filters Bar -->
  <div *ngIf="organizations().length > 0 || searchTerm()" class="px-6 py-4 border-b border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30 flex items-center justify-between">
    <div class="flex items-center gap-4 w-full justify-between">
      <div class="relative w-full max-w-md">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <mat-icon class="!text-gray-400 !text-[18px] !w-[18px] !h-[18px]">search</mat-icon>
        </div>
        <input type="text" (keyup.enter)="onSearch($event)" (blur)="onSearch($event)" placeholder="Search organizations..." class="block w-full pl-10 pr-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg leading-5 bg-white dark:bg-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-all shadow-sm">
      </div>
      
      <div class="relative flex items-center gap-3">
        <div class="text-sm font-medium text-gray-500 dark:text-gray-400 whitespace-nowrap">Filter by:</div>
        <div class="relative">
          <select (change)="onFilterStatus($event)" class="block w-40 pl-3 pr-10 py-2 text-base border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-lg shadow-sm appearance-none cursor-pointer">
            <option value="">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Suspended">Suspended</option>
            <option value="Inactive">Inactive</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">expand_more</mat-icon>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-empty-state 
    *ngIf="!isLoading() && organizations().length === 0 && !searchTerm() && !error()"
    icon="domain_disabled"
    title="No Organizations Found"
    description="Get started by creating your first business entity to manage farms, branches, and operations."
    actionLabel="Add Organization"
    (action)="onAdd()">
  </app-empty-state>

  <app-empty-state 
    *ngIf="!isLoading() && organizations().length === 0 && searchTerm() && !error()"
    icon="search_off"
    title="No matches found"
    description="We couldn't find any organizations matching your search or filters.">
  </app-empty-state>

  <div *ngIf="!isLoading() && organizations().length > 0 && !error()">

  <app-data-table
    [data]="organizations()"
    [columns]="columns"
    [displayedColumns]="displayedColumns"
    [isServerSide]="true"
    [totalLength]="totalCount()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    (page)="onPageChange($event)"
    (view)="onView($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (restore)="onRestore($event)">
  </app-data-table>
  </div>
</div>
