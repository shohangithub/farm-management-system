<app-page-header 
  title="Branches" 
  description="Manage locations and units for this organization."
  primaryActionLabel="Add Branch"
  primaryActionIcon="add"
  (primaryAction)="onAdd()">
</app-page-header>

<div class="bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative min-h-[400px]">
  
  <div *ngIf="error()" class="m-6 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 text-red-600 dark:text-red-400 p-4 rounded-r-md shadow-sm flex items-start gap-3 animate-fade-in-up">
    <mat-icon class="!text-red-500 mt-0.5">error_outline</mat-icon>
    <div>
      <h3 class="text-sm font-semibold">Error</h3>
      <p class="text-xs mt-1">{{ error() }}</p>
    </div>
  </div>

  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <!-- Filters Bar -->
  <div *ngIf="branches().length > 0 || searchTerm()" class="px-6 py-4 border-b border-gray-100 dark:border-gray-800/50 bg-gray-50/50 dark:bg-gray-900/30">
    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="relative w-full sm:w-96">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <mat-icon class="!text-gray-400 !text-[18px] !w-[18px] !h-[18px]">search</mat-icon>
        </div>
        <input type="text" (keyup.enter)="onSearch($event)" (blur)="onSearch($event)" 
               class="block w-full pl-10 pr-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-colors" 
               placeholder="Search branches...">
      </div>
      
      <div class="w-full sm:w-auto flex items-center gap-3">
        <div class="text-sm font-medium text-gray-500 dark:text-gray-400 whitespace-nowrap">Filter by:</div>
        <div class="relative">
          <select (change)="onFilterStatus($event)" class="block w-44 pl-3 pr-10 py-2 text-base border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-lg shadow-sm appearance-none cursor-pointer">
            <option value="">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="Closed">Closed</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">expand_more</mat-icon>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-empty-state 
    *ngIf="!isLoading() && branches().length === 0 && !searchTerm() && !error()"
    icon="location_city"
    title="No Branches Found"
    description="Create your first branch to start tracking operations in this location."
    actionLabel="Add Branch"
    (action)="onAdd()">
  </app-empty-state>

  <app-empty-state 
    *ngIf="!isLoading() && branches().length === 0 && searchTerm() && !error()"
    icon="search_off"
    title="No matches found"
    description="We couldn't find any branches matching your search or filters.">
  </app-empty-state>

  <div *ngIf="!isLoading() && branches().length > 0 && !error()">
    <app-data-table
      [data]="branches()"
      [columns]="columns"
      [displayedColumns]="displayedColumns"
      [isServerSide]="true"
      [totalLength]="totalCount()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      (page)="onPageChange($event)"
      (view)="onView($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (restore)="onRestore($event)">
    </app-data-table>
  </div>
</div>
