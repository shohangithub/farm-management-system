<app-page-header 
  [title]="isEditMode() ? 'Edit Branch' : 'Add Branch'" 
  [description]="isEditMode() ? 'Update location and contact details.' : 'Create a new branch or unit.'">
</app-page-header>

<div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 p-4 rounded-md mb-6 shadow-sm">
  {{ error() }}
</div>

<form [formGroup]="branchForm" (ngSubmit)="onSubmit()" class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-gray-100 dark:border-gray-800/50 divide-y divide-gray-100 dark:divide-gray-800/50">
  
  <div class="p-6 sm:p-8 space-y-6">
    <div>
      <h3 class="text-lg font-bold text-gray-900 dark:text-white tracking-tight">Basic Information</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Core details for this branch.</p>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-6">
      <div class="sm:col-span-2 form-group">
        <label for="branchCode" class="form-label">Branch Code *</label>
        <input type="text" formControlName="branchCode" id="branchCode" class="form-control uppercase" placeholder="BR-001">
      </div>

      <div class="sm:col-span-4 form-group">
        <label for="name" class="form-label">Branch Name *</label>
        <input type="text" formControlName="name" id="name" class="form-control" placeholder="Main Farm">
      </div>

      <div class="sm:col-span-6 flex items-center">
        <input type="checkbox" formControlName="isHeadOffice" id="isHeadOffice" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 dark:border-gray-600 rounded">
        <label for="isHeadOffice" class="ml-2 block text-sm text-gray-700 dark:text-gray-300 font-medium">
          This is the Head Office
        </label>
      </div>
    </div>
  </div>

  <div class="p-6 sm:p-8 space-y-6">
    <div>
      <h3 class="text-lg font-bold text-gray-900 dark:text-white tracking-tight">Contact & Address</h3>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-6">
      <div class="sm:col-span-3 form-group">
        <label for="contactEmail" class="form-label">Contact Email *</label>
        <input type="email" formControlName="contactEmail" id="contactEmail" class="form-control" placeholder="branch@example.com">
      </div>

      <div class="sm:col-span-3 form-group">
        <label for="contactPhone" class="form-label">Contact Phone</label>
        <input type="text" formControlName="contactPhone" id="contactPhone" class="form-control" placeholder="+1 (555) 000-0000">
      </div>

      <div class="sm:col-span-6 form-group">
        <label for="street" class="form-label">Street Address</label>
        <input type="text" formControlName="street" id="street" class="form-control">
      </div>
      
      <div class="sm:col-span-2 form-group">
        <label for="city" class="form-label">City</label>
        <input type="text" formControlName="city" id="city" class="form-control">
      </div>
      
      <div class="sm:col-span-2 form-group">
        <label for="state" class="form-label">State / Province</label>
        <input type="text" formControlName="state" id="state" class="form-control">
      </div>
      
      <div class="sm:col-span-2 form-group">
        <label for="zipCode" class="form-label">ZIP / Postal Code</label>
        <input type="text" formControlName="zipCode" id="zipCode" class="form-control">
      </div>

      <div class="sm:col-span-3 form-group">
        <label for="country" class="form-label">Country</label>
        <input type="text" formControlName="country" id="country" class="form-control">
      </div>
    </div>
  </div>

  <div class="p-6 sm:p-8 space-y-6">
    <div>
      <h3 class="text-lg font-bold text-gray-900 dark:text-white tracking-tight">Additional Details</h3>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-6">
      <div class="sm:col-span-3 form-group">
        <label for="workingHours" class="form-label">Working Hours</label>
        <input type="text" formControlName="workingHours" id="workingHours" class="form-control" placeholder="e.g. Mon-Fri, 9AM-5PM">
      </div>

      <div class="sm:col-span-3 form-group">
        <label for="holidayCalendar" class="form-label">Holiday Calendar ID</label>
        <input type="text" formControlName="holidayCalendar" id="holidayCalendar" class="form-control">
      </div>

      <div class="sm:col-span-3 form-group">
        <label for="latitude" class="form-label">Latitude</label>
        <input type="number" formControlName="latitude" id="latitude" class="form-control" placeholder="e.g. 40.7128">
      </div>

      <div class="sm:col-span-3 form-group">
        <label for="longitude" class="form-label">Longitude</label>
        <input type="number" formControlName="longitude" id="longitude" class="form-control" placeholder="e.g. -74.0060">
      </div>
    </div>
  </div>

  <div class="p-6 sm:p-8 bg-gray-50 dark:bg-gray-800/20 rounded-b-xl flex items-center justify-end gap-3">
    <button type="button" [routerLink]="['/organizations', orgId(), 'branches']" class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors shadow-sm">
      Cancel
    </button>
    <button type="submit" [disabled]="branchForm.invalid || isSubmitting()" class="px-4 py-2 text-sm font-semibold text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
      {{ isSubmitting() ? 'Saving...' : 'Save Branch' }}
    </button>
  </div>
</form>
