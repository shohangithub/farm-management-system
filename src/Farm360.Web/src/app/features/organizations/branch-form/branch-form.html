<div class="page-header mb-6">
  <div class="flex items-center">
    <button [routerLink]="['/organizations', orgId(), 'branches']" class="mr-4 text-gray-400 hover:text-gray-500">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </button>
    <div>
      <h1 class="text-2xl font-bold text-gray-900">{{ isEditMode() ? 'Edit Branch' : 'Add Branch' }}</h1>
      <p class="text-sm text-gray-500">{{ isEditMode() ? 'Update location details.' : 'Create a new branch or unit.' }}</p>
    </div>
  </div>
</div>

<div *ngIf="error()" class="bg-red-50 border border-red-200 text-red-600 p-4 rounded-md mb-6">
  {{ error() }}
</div>

<form [formGroup]="branchForm" (ngSubmit)="onSubmit()" class="space-y-8 divide-y divide-gray-200 bg-white p-6 rounded-lg shadow">
  
  <div class="space-y-6 sm:space-y-5">
    <div>
      <h3 class="text-lg leading-6 font-medium text-gray-900">Branch Details</h3>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
      <div class="sm:col-span-2">
        <label for="branchCode" class="block text-sm font-medium text-gray-700">Branch Code *</label>
        <div class="mt-1">
          <input type="text" formControlName="branchCode" id="branchCode" class="input uppercase">
        </div>
      </div>

      <div class="sm:col-span-4">
        <label for="name" class="block text-sm font-medium text-gray-700">Branch Name *</label>
        <div class="mt-1">
          <input type="text" formControlName="name" id="name" class="input">
        </div>
      </div>
      
      <div class="sm:col-span-6 flex items-center">
        <input id="isHeadOffice" formControlName="isHeadOffice" type="checkbox" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
        <label for="isHeadOffice" class="ml-2 block text-sm text-gray-900">
          Mark as Head Office
        </label>
      </div>

      <div *ngIf="isEditMode()" class="sm:col-span-2">
        <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
        <div class="mt-1">
          <select id="status" formControlName="status" class="input">
            <option [value]="1">Active</option>
            <option [value]="2">Inactive</option>
            <option [value]="3">Closed</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="pt-8 space-y-6 sm:space-y-5">
    <div>
      <h3 class="text-lg leading-6 font-medium text-gray-900">Contact & Address</h3>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
      <div class="sm:col-span-3">
        <label for="contactEmail" class="block text-sm font-medium text-gray-700">Contact Email *</label>
        <div class="mt-1">
          <input type="email" formControlName="contactEmail" id="contactEmail" class="input">
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="contactPhone" class="block text-sm font-medium text-gray-700">Contact Phone</label>
        <div class="mt-1">
          <input type="text" formControlName="contactPhone" id="contactPhone" class="input">
        </div>
      </div>

      <div class="sm:col-span-6">
        <label for="street" class="block text-sm font-medium text-gray-700">Street Address</label>
        <div class="mt-1">
          <input type="text" formControlName="street" id="street" class="input">
        </div>
      </div>

      <div class="sm:col-span-2">
        <label for="city" class="block text-sm font-medium text-gray-700">City</label>
        <div class="mt-1">
          <input type="text" formControlName="city" id="city" class="input">
        </div>
      </div>
      
      <div class="sm:col-span-2">
        <label for="state" class="block text-sm font-medium text-gray-700">State / Province</label>
        <div class="mt-1">
          <input type="text" formControlName="state" id="state" class="input">
        </div>
      </div>
      
      <div class="sm:col-span-2">
        <label for="country" class="block text-sm font-medium text-gray-700">Country</label>
        <div class="mt-1">
          <input type="text" formControlName="country" id="country" class="input">
        </div>
      </div>
      
      <div class="sm:col-span-2">
        <label for="zipCode" class="block text-sm font-medium text-gray-700">ZIP / Postal Code</label>
        <div class="mt-1">
          <input type="text" formControlName="zipCode" id="zipCode" class="input">
        </div>
      </div>
    </div>
  </div>

  <div class="pt-8 space-y-6 sm:space-y-5">
    <div>
      <h3 class="text-lg leading-6 font-medium text-gray-900">Operations & Geo</h3>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
      <div class="sm:col-span-3">
        <label for="latitude" class="block text-sm font-medium text-gray-700">Latitude</label>
        <div class="mt-1">
          <input type="number" step="0.00000001" formControlName="latitude" id="latitude" class="input">
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="longitude" class="block text-sm font-medium text-gray-700">Longitude</label>
        <div class="mt-1">
          <input type="number" step="0.00000001" formControlName="longitude" id="longitude" class="input">
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="workingHours" class="block text-sm font-medium text-gray-700">Working Hours (JSON/String)</label>
        <div class="mt-1">
          <input type="text" formControlName="workingHours" id="workingHours" class="input" placeholder='e.g., {"Mon-Fri": "09:00-17:00"}'>
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="holidayCalendar" class="block text-sm font-medium text-gray-700">Holiday Calendar (JSON/String)</label>
        <div class="mt-1">
          <input type="text" formControlName="holidayCalendar" id="holidayCalendar" class="input">
        </div>
      </div>
    </div>
  </div>

  <div class="pt-5">
    <div class="flex justify-end">
      <button type="button" [routerLink]="['/organizations', orgId(), 'branches']" class="btn btn-outline mr-3">Cancel</button>
      <button type="submit" [disabled]="branchForm.invalid || isSubmitting()" class="btn btn-primary disabled:opacity-50">
        {{ isSubmitting() ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </div>
</form>
