<div class="page-header mb-6">
  <div class="flex items-center">
    <button routerLink="/organizations" class="mr-4 text-gray-400 hover:text-gray-500">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </button>
    <div>
      <h1 class="text-2xl font-bold text-gray-900">{{ isEditMode() ? 'Edit Organization' : 'Add Organization' }}</h1>
      <p class="text-sm text-gray-500">{{ isEditMode() ? 'Update business details.' : 'Create a new business entity.' }}</p>
    </div>
  </div>
</div>

<div *ngIf="error()" class="bg-red-50 border border-red-200 text-red-600 p-4 rounded-md mb-6">
  {{ error() }}
</div>

<form [formGroup]="orgForm" (ngSubmit)="onSubmit()" class="space-y-8 divide-y divide-gray-200 bg-white p-6 rounded-lg shadow">
  
  <div class="space-y-6 sm:space-y-5">
    <div>
      <h3 class="text-lg leading-6 font-medium text-gray-900">Basic Information</h3>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
      <div class="sm:col-span-4">
        <label for="name" class="block text-sm font-medium text-gray-700">Organization Name *</label>
        <div class="mt-1">
          <input type="text" formControlName="name" id="name" class="input">
        </div>
      </div>

      <div class="sm:col-span-2">
        <label for="businessType" class="block text-sm font-medium text-gray-700">Business Type *</label>
        <div class="mt-1">
          <select id="businessType" formControlName="businessType" class="input">
            <option [value]="1">Farm</option>
            <option [value]="2">Supplier</option>
            <option [value]="3">Buyer</option>
            <option [value]="4">Veterinary Clinic</option>
            <option [value]="5">Cooperative</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="pt-8 space-y-6 sm:space-y-5">
    <div>
      <h3 class="text-lg leading-6 font-medium text-gray-900">Contact & Regional</h3>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
      <div class="sm:col-span-3">
        <label for="contactEmail" class="block text-sm font-medium text-gray-700">Contact Email *</label>
        <div class="mt-1">
          <input type="email" formControlName="contactEmail" id="contactEmail" class="input">
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="contactPhone" class="block text-sm font-medium text-gray-700">Contact Phone</label>
        <div class="mt-1">
          <input type="text" formControlName="contactPhone" id="contactPhone" class="input">
        </div>
      </div>

      <div class="sm:col-span-2">
        <label for="currencyCode" class="block text-sm font-medium text-gray-700">Currency *</label>
        <div class="mt-1">
          <select id="currencyCode" formControlName="currencyCode" class="input">
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
          </select>
        </div>
      </div>

      <div class="sm:col-span-2">
        <label for="timeZoneId" class="block text-sm font-medium text-gray-700">Time Zone *</label>
        <div class="mt-1">
          <input type="text" formControlName="timeZoneId" id="timeZoneId" class="input">
        </div>
      </div>
      
      <div class="sm:col-span-2">
        <label for="languageCode" class="block text-sm font-medium text-gray-700">Language *</label>
        <div class="mt-1">
          <input type="text" formControlName="languageCode" id="languageCode" class="input">
        </div>
      </div>
    </div>
  </div>

  <div class="pt-8 space-y-6 sm:space-y-5">
    <div>
      <h3 class="text-lg leading-6 font-medium text-gray-900">Legal Details</h3>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
      <div class="sm:col-span-2">
        <label for="businessRegistrationNumber" class="block text-sm font-medium text-gray-700">Business Reg Number</label>
        <div class="mt-1">
          <input type="text" formControlName="businessRegistrationNumber" id="businessRegistrationNumber" class="input">
        </div>
      </div>

      <div class="sm:col-span-2">
        <label for="tradeLicenseNumber" class="block text-sm font-medium text-gray-700">Trade License Number</label>
        <div class="mt-1">
          <input type="text" formControlName="tradeLicenseNumber" id="tradeLicenseNumber" class="input">
        </div>
      </div>

      <div class="sm:col-span-2">
        <label for="taxIdentificationNumber" class="block text-sm font-medium text-gray-700">Tax ID (BIN/TIN)</label>
        <div class="mt-1">
          <input type="text" formControlName="taxIdentificationNumber" id="taxIdentificationNumber" class="input">
        </div>
      </div>
    </div>
  </div>

  <div class="pt-5">
    <div class="flex justify-end">
      <button type="button" routerLink="/organizations" class="btn btn-outline mr-3">Cancel</button>
      <button type="submit" [disabled]="orgForm.invalid || isSubmitting()" class="btn btn-primary disabled:opacity-50">
        {{ isSubmitting() ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </div>
</form>
