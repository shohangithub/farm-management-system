<app-page-header 
  [title]="isEditMode() ? 'Edit Organization' : 'Add Organization'" 
  [description]="isEditMode() ? 'Update business details.' : 'Create a new business entity.'">
</app-page-header>

<div *ngIf="error()" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 p-4 rounded-md mb-6 shadow-sm">
  {{ error() }}
</div>

<div *ngIf="successMessage()" class="bg-accent-50 dark:bg-accent-900/20 border border-accent-200 dark:border-accent-800 text-accent-700 dark:text-accent-400 p-4 rounded-md mb-6 shadow-sm">
  {{ successMessage() }}
</div>

<form [formGroup]="orgForm" (ngSubmit)="onSubmit()" class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-gray-100 dark:border-gray-800/50 divide-y divide-gray-100 dark:divide-gray-800/50">
  
  <div class="p-6 sm:p-8 space-y-6">
    <div>
      <h3 class="text-lg font-bold text-gray-900 dark:text-white tracking-tight">Basic Information</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Provide the fundamental details about this business entity.</p>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-6">
      <div class="sm:col-span-4 form-group">
        <label for="name" class="form-label">Organization Name *</label>
        <input type="text" formControlName="name" id="name" class="form-control" placeholder="Enter organization name">
      </div>

      <div class="sm:col-span-2 form-group">
        <label for="businessType" class="form-label">Business Type *</label>
        <select id="businessType" formControlName="businessType" class="form-control">
          <option [ngValue]="1">Farm</option>
          <option [ngValue]="2">Supplier</option>
          <option [ngValue]="3">Buyer</option>
          <option [ngValue]="4">Veterinary Clinic</option>
          <option [ngValue]="5">Cooperative</option>
        </select>
      </div>
    </div>
  </div>

  <div class="p-6 sm:p-8 space-y-6">
    <div>
      <h3 class="text-lg font-bold text-gray-900 dark:text-white tracking-tight">Contact & Regional</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">How can we reach this organization and where are they based?</p>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-6">
      <div class="sm:col-span-3 form-group">
        <label for="contactEmail" class="form-label">Contact Email *</label>
        <input type="email" formControlName="contactEmail" id="contactEmail" class="form-control" placeholder="admin@example.com">
      </div>

      <div class="sm:col-span-3 form-group">
        <label for="contactPhone" class="form-label">Contact Phone</label>
        <input type="text" formControlName="contactPhone" id="contactPhone" class="form-control" placeholder="+1 (555) 000-0000">
      </div>

      <div class="sm:col-span-2 form-group">
        <label for="currencyCode" class="form-label">Currency *</label>
        <select id="currencyCode" formControlName="currencyCode" class="form-control">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
        </select>
      </div>

      <div class="sm:col-span-2 form-group">
        <label for="timeZoneId" class="form-label">Time Zone *</label>
        <input type="text" formControlName="timeZoneId" id="timeZoneId" class="form-control" placeholder="e.g. UTC, America/New_York">
      </div>
      
      <div class="sm:col-span-2 form-group">
        <label for="languageCode" class="form-label">Language *</label>
        <input type="text" formControlName="languageCode" id="languageCode" class="form-control" placeholder="en-US">
      </div>
    </div>
  </div>

  <div class="p-6 sm:p-8 space-y-6">
    <div>
      <h3 class="text-lg font-bold text-gray-900 dark:text-white tracking-tight">Legal Details</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Official registration details for compliance and billing.</p>
    </div>
    
    <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-6">
      <div class="sm:col-span-2 form-group">
        <label for="businessRegistrationNumber" class="form-label">Business Reg Number</label>
        <input type="text" formControlName="businessRegistrationNumber" id="businessRegistrationNumber" class="form-control">
      </div>

      <div class="sm:col-span-2 form-group">
        <label for="tradeLicenseNumber" class="form-label">Trade License Number</label>
        <input type="text" formControlName="tradeLicenseNumber" id="tradeLicenseNumber" class="form-control">
      </div>

      <div class="sm:col-span-2 form-group">
        <label for="taxIdentificationNumber" class="form-label">Tax ID (BIN/TIN)</label>
        <input type="text" formControlName="taxIdentificationNumber" id="taxIdentificationNumber" class="form-control">
      </div>
    </div>
  </div>

  <div class="p-6 sm:p-8 bg-gray-50 dark:bg-gray-800/20 rounded-b-xl flex items-center justify-end gap-3">
    <button type="button" routerLink="/organizations" class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors shadow-sm">
      Cancel
    </button>
    <button type="submit" [disabled]="orgForm.invalid || isSubmitting()" class="px-4 py-2 text-sm font-semibold text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
      {{ isSubmitting() ? 'Saving...' : 'Save Organization' }}
    </button>
  </div>
</form>
