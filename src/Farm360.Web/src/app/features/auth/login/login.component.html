<div class="login-page">
  <div class="login-card">

    <!-- Brand Header -->
    <div class="login-brand">
      <div class="login-logo">
        <span class="material-icons">agriculture</span>
      </div>
      <h1 class="login-title">Farm360 AI</h1>
      <p class="login-subtitle">Enterprise Livestock Management Platform</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="login-error" role="alert">
      <span class="material-icons">error_outline</span>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Login Form -->
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- Phone Number -->
      <div class="form-group">
        <label for="phone" class="form-label">Phone Number</label>
        <input
          id="phone"
          type="tel"
          formControlName="phone"
          class="form-control"
          placeholder="+880XXXXXXXXXX"
          autocomplete="username"
          [attr.aria-invalid]="loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched">
        <span
          *ngIf="loginForm.get('phone')?.touched && loginForm.get('phone')?.invalid"
          class="field-error"
          role="alert">
          Phone number is required.
        </span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="Enter your password"
          autocomplete="current-password"
          [attr.aria-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <span
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          class="field-error"
          role="alert">
          Password is required.
        </span>
      </div>

      <!-- Submit Button -->
      <button
        id="btn-login-submit"
        type="submit"
        class="btn-login"
        [disabled]="isLoading">
        <span *ngIf="isLoading" class="login-spinner"></span>
        <span class="material-icons" *ngIf="!isLoading" style="font-size:18px;">login</span>
        {{ isLoading ? 'Signing in…' : 'Sign In' }}
      </button>

    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>Farm360 AI &copy; {{ currentYear }} &middot; Enterprise Edition</p>
    </div>

  </div>
</div>
