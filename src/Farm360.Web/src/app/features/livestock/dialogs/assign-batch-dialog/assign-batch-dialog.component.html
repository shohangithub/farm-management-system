<div class="bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
  <!-- Header -->
  <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-800 bg-purple-50/50 dark:bg-purple-900/10 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-purple-700 dark:text-purple-400 flex items-center gap-2">
        <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">group_work</mat-icon>
        Assign to Batch
      </h2>
      <p class="text-xs text-purple-600/70 dark:text-purple-400/70 mt-0.5">Move {{ data.animalTag }} to a different batch group</p>
    </div>
    <button mat-dialog-close class="p-2 -mr-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
      <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col overflow-hidden">
    <!-- Error State inside Dialog -->
    <div *ngIf="error()" class="mx-6 mt-4 p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm whitespace-pre-wrap">
      {{ error() }}
    </div>

    <!-- Body -->
    <div class="p-6 space-y-4 overflow-y-auto">
      <div class="space-y-1.5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Select Batch <span class="text-red-500">*</span></label>
        
        <div *ngIf="data.availableBatches.length === 0" class="text-sm text-gray-500 italic p-3 bg-gray-50 dark:bg-gray-800/50 rounded-lg border border-gray-200 dark:border-gray-700">
          No active batches found for this farm.
        </div>

        <select *ngIf="data.availableBatches.length > 0" formControlName="batchId"
          class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-shadow">
          <option value="" disabled>Select a batch...</option>
          <option *ngFor="let b of data.availableBatches" [value]="b.id">{{ b.name }} ({{ b.animalCount }} animals)</option>
        </select>
        <p class="text-xs text-red-500 mt-1" *ngIf="form.get('batchId')?.touched && form.get('batchId')?.invalid">
          Please select a batch.
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
      <button type="button" mat-dialog-close [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl hover:bg-gray-50 transition-colors shadow-sm">
        Cancel
      </button>
      <button type="submit" [disabled]="submitting() || data.availableBatches.length === 0"
        class="px-4 py-2 text-sm font-semibold text-white bg-purple-600 rounded-xl hover:bg-purple-700 transition-colors shadow-sm shadow-purple-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!submitting()">Assign</span>
        <span *ngIf="submitting()">Assigning...</span>
      </button>
    </div>
  </form>
</div>
