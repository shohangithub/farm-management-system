<div class="bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
  <!-- Header -->
  <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-800 bg-amber-50/50 dark:bg-amber-900/20 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-amber-900 dark:text-amber-400 flex items-center gap-2">
        <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">warning</mat-icon>
        Quarantine Animal
      </h2>
      <p class="text-xs text-amber-700/70 dark:text-amber-400/70 mt-0.5">Move {{ data.animalTag }} to quarantine</p>
    </div>
    <button mat-dialog-close class="p-2 -mr-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
      <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col overflow-hidden">
    <!-- Error State inside Dialog -->
    <div *ngIf="error()" class="mx-6 mt-4 p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm whitespace-pre-wrap">
      {{ error() }}
    </div>

    <div class="p-6 space-y-4 overflow-y-auto">
      <!-- Reason -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Reason for Quarantine <span class="text-red-500">*</span></label>
        <div class="relative">
          <textarea formControlName="reason" rows="3"
            placeholder="Describe symptoms or reason for quarantine..."
            class="block w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-shadow resize-none"></textarea>
        </div>
        <p class="text-xs text-red-500 mt-1" *ngIf="form.get('reason')?.touched && form.get('reason')?.invalid">
          Please provide a valid reason (max 500 characters).
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
      <button type="button" mat-dialog-close [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl hover:bg-gray-50 transition-colors shadow-sm">
        Cancel
      </button>
      <button type="submit" [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-white bg-amber-600 rounded-xl hover:bg-amber-700 transition-colors shadow-sm shadow-amber-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!submitting()">Quarantine</span>
        <span *ngIf="submitting()">Processing...</span>
      </button>
    </div>
  </form>
</div>
