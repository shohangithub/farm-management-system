<div class="bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
  <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-800 bg-pink-50/50 dark:bg-pink-900/10 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-pink-700 dark:text-pink-400 flex items-center gap-2">
        <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">pregnant_woman</mat-icon>
        Confirm Pregnancy
      </h2>
      <p class="text-xs text-pink-600/70 dark:text-pink-400/70 mt-0.5">Record successful pregnancy for {{ data.animalTag }}</p>
    </div>
    <button mat-dialog-close class="p-2 -mr-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
      <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col overflow-hidden">
    <!-- Error State inside Dialog -->
    <div *ngIf="error()" class="mx-6 mt-4 p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm whitespace-pre-wrap">
      {{ error() }}
    </div>

    <div class="p-6 space-y-4 overflow-y-auto">
      <div class="space-y-1.5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Confirmation Date <span class="text-red-500">*</span></label>
        <input type="date" formControlName="confirmDate"
          class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500 focus:border-pink-500 transition-shadow">
        <p class="text-xs text-red-500 mt-1" *ngIf="form.get('confirmDate')?.touched && form.get('confirmDate')?.invalid">
          Confirmation Date is required.
        </p>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Expected Calving Date <span class="text-red-500">*</span></label>
        <input type="date" formControlName="expectedCalvingDate"
          class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500 focus:border-pink-500 transition-shadow">
        <p class="text-xs text-red-500 mt-1" *ngIf="form.get('expectedCalvingDate')?.touched && form.get('expectedCalvingDate')?.invalid">
          Expected Calving Date is required.
        </p>
        <p class="text-xs text-gray-400 mt-1">Default estimated at ~283 days. Adjust if species varies.</p>
      </div>
    </div>

    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
      <button type="button" mat-dialog-close [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl hover:bg-gray-50 transition-colors shadow-sm">
        Cancel
      </button>
      <button type="submit" [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-white bg-pink-600 rounded-xl hover:bg-pink-700 transition-colors shadow-sm shadow-pink-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!submitting()">Confirm Pregnancy</span>
        <span *ngIf="submitting()">Confirming...</span>
      </button>
    </div>
  </form>
</div>
