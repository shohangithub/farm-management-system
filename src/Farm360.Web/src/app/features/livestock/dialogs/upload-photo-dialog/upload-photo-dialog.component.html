<div class="bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
  <!-- Header -->
  <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/30 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
        <mat-icon class="!text-[20px] !w-[20px] !h-[20px] text-gray-500">add_photo_alternate</mat-icon>
        Upload Photo
      </h2>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Add a new photo to {{ data.animalTag }}'s gallery</p>
    </div>
    <button mat-dialog-close class="p-2 -mr-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
      <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col overflow-hidden">
    <!-- Error State inside Dialog -->
    <div *ngIf="error()" class="mx-6 mt-4 p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm whitespace-pre-wrap">
      {{ error() }}
    </div>

    <!-- Body -->
    <div class="p-6 space-y-5 overflow-y-auto">
      
      <!-- File Input area -->
      <div class="space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Select Image <span class="text-red-500">*</span></label>
        
        <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 dark:border-gray-700 border-dashed rounded-xl hover:border-primary-500 dark:hover:border-primary-500 transition-colors bg-gray-50 dark:bg-gray-800/50"
             [class.border-primary-500]="selectedFile()" [class.bg-primary-50]="selectedFile()">
          <div class="space-y-1 text-center">
            <mat-icon class="mx-auto !h-12 !w-12 !text-[48px] text-gray-400" [class.text-primary-500]="selectedFile()">
              {{ selectedFile() ? 'check_circle' : 'image' }}
            </mat-icon>
            <div class="flex text-sm text-gray-600 dark:text-gray-400 justify-center">
              <label class="relative cursor-pointer bg-transparent rounded-md font-medium text-primary-600 hover:text-primary-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-primary-500">
                <span>{{ selectedFile() ? 'Change file' : 'Upload a file' }}</span>
                <input #fileInput type="file" class="sr-only" accept="image/jpeg,image/png,image/webp" (change)="onFileSelected($event)">
              </label>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-500">PNG, JPG, WEBP up to {{ Math.round(MAX_FILE_SIZE / 1024 / 1024) }}MB</p>
            
            <p *ngIf="selectedFile()" class="text-xs font-bold text-gray-900 dark:text-white mt-2 bg-white dark:bg-gray-900 inline-block px-2 py-1 rounded shadow-sm border border-gray-200 dark:border-gray-700">
              {{ selectedFile()?.name }}
            </p>
          </div>
        </div>
      </div>

      <!-- Caption -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Caption</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">title</mat-icon>
          </span>
          <input type="text" formControlName="caption" placeholder="Optional description..." maxlength="200"
            class="block w-full pl-9 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
      <button type="button" mat-dialog-close [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl hover:bg-gray-50 transition-colors shadow-sm">
        Cancel
      </button>
      <button type="submit" [disabled]="submitting() || !selectedFile()"
        class="px-4 py-2 text-sm font-semibold text-white bg-primary-600 rounded-xl hover:bg-primary-700 transition-colors shadow-sm shadow-primary-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!submitting()">Upload</span>
        <span *ngIf="submitting()">Uploading...</span>
      </button>
    </div>
  </form>
</div>
