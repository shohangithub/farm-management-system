<div class="bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
  <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/30 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
        <mat-icon class="!text-[20px] !w-[20px] !h-[20px] text-primary-500">scale</mat-icon>
        {{ 'Record Weight' | t }}
      </h2>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{{ 'Enter new weight for {tag}' | t: { tag: data.animalTag } }}</p>
    </div>
    <button [attr.aria-label]="'Close' | t" mat-dialog-close class="p-2 -mr-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
      <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col overflow-hidden">
    <!-- Error State inside Dialog -->
    <div *ngIf="error()" class="mx-6 mt-4 p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm whitespace-pre-wrap">
      {{ error() }}
    </div>

    <div class="p-6 space-y-4 overflow-y-auto">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">{{ 'Weight (kg)' | t }} <span class="text-red-500">*</span></label>
          <div class="relative">
            <input type="number" formControlName="weightKg" min="1" step="0.1"
              class="block w-full pr-10 pl-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-500 font-medium text-sm">{{ 'kg' | t }}</span>
          </div>
          <p class="text-xs text-red-500 mt-1" *ngIf="form.get('weightKg')?.touched && form.get('weightKg')?.invalid">
            {{ 'Weight is required and must be greater than 0.' | t }}
          </p>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">{{ 'Recorded Date' | t }} <span class="text-red-500">*</span></label>
          <input type="date" formControlName="recordedDate"
            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
          <p class="text-xs text-red-500 mt-1" *ngIf="form.get('recordedDate')?.touched && form.get('recordedDate')?.invalid">
            {{ 'Date is required.' | t }}
          </p>
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">{{ 'Notes (Optional)' | t }}</label>
        <textarea formControlName="notes" rows="2"
          class="block w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow resize-none"></textarea>
      </div>
    </div>

    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
      <button type="button" mat-dialog-close [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl hover:bg-gray-50 transition-colors shadow-sm">
        {{ 'Cancel' | t }}
      </button>
      <button type="submit" [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-white bg-primary-600 rounded-xl hover:bg-primary-700 transition-colors shadow-sm shadow-primary-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!submitting()">{{ 'Save Weight' | t }}</span>
        <span *ngIf="submitting()">{{ 'Saving...' | t }}</span>
      </button>
    </div>
  </form>
</div>
