<div class="bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
  <!-- Header -->
  <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/30 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
        <mat-icon class="!text-[20px] !w-[20px] !h-[20px] text-gray-500">place</mat-icon>
        Assign Location
      </h2>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Transfer {{ data.animalTag }} to a new shed or pen</p>
    </div>
    <button mat-dialog-close class="p-2 -mr-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
      <mat-icon class="!text-[20px] !w-[20px] !h-[20px]">close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col overflow-hidden">
    <!-- Error State inside Dialog -->
    <div *ngIf="error()" class="mx-6 mt-4 p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm whitespace-pre-wrap">
      {{ error() }}
    </div>

    <div class="p-6 space-y-5 overflow-y-auto">
      <!-- Shed -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Target Shed</label>
        <div *ngIf="loadingSheds()" class="text-xs text-gray-400">Loading sheds...</div>
        <select *ngIf="!loadingSheds()" formControlName="shedId"
          class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
          <option value="">-- Optional --</option>
          <option *ngFor="let s of sheds()" [value]="s.id">{{ s.shedName }} ({{ s.capacity }} cap)</option>
        </select>
      </div>

      <!-- Pen -->
      <div class="space-y-1.5" *ngIf="form.get('shedId')?.value">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Target Pen</label>
        <div *ngIf="loadingPens()" class="text-xs text-gray-400">Loading pens...</div>
        <select *ngIf="!loadingPens()" formControlName="penId"
          class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
          <option value="">-- Optional --</option>
          <option *ngFor="let p of pens()" [value]="p.id">{{ p.penNumber }}</option>
        </select>
      </div>

      <!-- Date Row -->
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Transfer Date <span class="text-red-500">*</span></label>
          <input type="date" formControlName="transferDate"
            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
          <p class="text-xs text-red-500 mt-1" *ngIf="form.get('transferDate')?.touched && form.get('transferDate')?.invalid">
            Transfer Date is required.
          </p>
        </div>
      </div>

      <!-- Reason -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Reason</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <mat-icon class="!text-[18px] !w-[18px] !h-[18px]">notes</mat-icon>
          </span>
          <input type="text" formControlName="reason" placeholder="Optional"
            class="block w-full pl-9 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-shadow">
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
      <button type="button" mat-dialog-close [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl hover:bg-gray-50 transition-colors shadow-sm">
        Cancel
      </button>
      <button type="submit" [disabled]="submitting()"
        class="px-4 py-2 text-sm font-semibold text-white bg-primary-600 rounded-xl hover:bg-primary-700 transition-colors shadow-sm shadow-primary-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!submitting()">Confirm Transfer</span>
        <span *ngIf="submitting()">Transferring...</span>
      </button>
    </div>
  </form>
</div>
