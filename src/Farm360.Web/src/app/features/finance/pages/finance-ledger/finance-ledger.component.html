<app-page-header
  title="Finance Ledger"
  description="Manage incomes, expenses, and view your farm's financial health."
  breadcrumbActiveNode="Finance">
  <div actions class="flex gap-3">
    <button mat-flat-button color="accent" class="rounded-xl shadow-md bg-emerald-600 hover:bg-emerald-700 text-white flex items-center gap-2" (click)="openIncomeDialog()">
      <mat-icon>arrow_downward</mat-icon>
      <span>Record Income</span>
    </button>
    <button mat-flat-button color="warn" class="rounded-xl shadow-md bg-rose-600 hover:bg-rose-700 text-white flex items-center gap-2" (click)="openExpenseDialog()">
      <mat-icon>arrow_upward</mat-icon>
      <span>Record Expense</span>
    </button>
  </div>
</app-page-header>

<div class="px-6 py-4 mx-auto max-w-7xl">

  <app-loading *ngIf="isLoading()" [overlay]="true"></app-loading>

  <!-- Transactions Table -->
  <div class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800/50 overflow-hidden relative mt-4">
    
    <app-empty-state 
      *ngIf="!isLoading() && transactions().length === 0"
      icon="receipt_long"
      title="No Transactions Found"
      description="You haven't recorded any incomes or expenses yet."
      actionText="Record Income"
      (action)="openIncomeDialog()">
    </app-empty-state>

    <div *ngIf="transactions().length > 0" class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50/50 dark:bg-gray-700/50 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider font-semibold border-b border-gray-100 dark:border-gray-800/50">
            <th class="py-4 px-6 font-medium">Date</th>
            <th class="py-4 px-6 font-medium">Type</th>
            <th class="py-4 px-6 font-medium">Category</th>
            <th class="py-4 px-6 font-medium">Amount (BDT)</th>
            <th class="py-4 px-6 font-medium">Notes</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-700/50">
          <tr *ngFor="let txn of transactions()" class="hover:bg-gray-50/50 dark:hover:bg-gray-700/50 transition-colors duration-200">
            <td class="py-4 px-6 text-sm text-gray-900 dark:text-gray-100">
              {{ txn.transactionDate | date:'mediumDate' }}
            </td>
            <td class="py-4 px-6 text-sm">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                [ngClass]="txn.type === 'Income' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400' : 'bg-rose-100 text-rose-800 dark:bg-rose-900/30 dark:text-rose-400'">
                {{ txn.type }}
              </span>
            </td>
            <td class="py-4 px-6 text-sm text-gray-600 dark:text-gray-300">
              {{ txn.category }}
            </td>
            <td class="py-4 px-6 text-sm font-semibold"
              [ngClass]="txn.type === 'Income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'">
              {{ txn.type === 'Income' ? '+' : '-' }}{{ txn.amountBdt | currency:'BDT ':'symbol':'1.2-2' }}
            </td>
            <td class="py-4 px-6 text-sm text-gray-500 dark:text-gray-400 truncate max-w-xs">
              {{ txn.notes || txn.description || '-' }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>
