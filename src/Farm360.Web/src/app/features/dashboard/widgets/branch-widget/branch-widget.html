<div class="bg-white overflow-hidden shadow rounded-lg">
  <div class="p-5">
    <div class="flex items-center">
      <div class="flex-shrink-0">
        <svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <div class="ml-5 w-0 flex-1">
        <dl>
          <dt class="text-sm font-medium text-gray-500 truncate">
            Active Branches
          </dt>
          <dd>
            <div class="text-lg font-medium text-gray-900" *ngIf="!isLoading()">
              {{ activeBranches() }} / {{ totalBranches() }}
            </div>
            <div *ngIf="isLoading()" class="h-6 w-12 bg-gray-200 animate-pulse rounded"></div>
          </dd>
        </dl>
      </div>
    </div>
  </div>
  <div class="bg-gray-50 px-5 py-3">
    <div class="text-sm">
      <a routerLink="/organizations" class="font-medium text-primary-600 hover:text-primary-900">
        View all branches
      </a>
    </div>
  </div>
</div>
