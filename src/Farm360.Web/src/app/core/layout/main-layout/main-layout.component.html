<mat-sidenav-container class="h-screen w-full bg-elevated-light dark:bg-elevated-dark">

  <!-- Sidebar -->
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile"
    class="border-r border-gray-100 dark:border-gray-800/50 bg-white dark:bg-surface-dark shadow-sm"
    [style.width.px]="(isMobile || !isSidebarCollapsed) ? 200 : 64"
    style="transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); overflow: hidden;">
    <app-sidebar [isCollapsed]="!isMobile && isSidebarCollapsed"></app-sidebar>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="flex flex-col h-full overflow-hidden bg-elevated-light dark:bg-elevated-dark">
    <!-- Top Header -->
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Page Content -->
    <main class="flex-1 overflow-auto p-4 md:p-8">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
