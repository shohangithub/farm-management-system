<div class="flex flex-col h-full overflow-y-auto overflow-x-hidden bg-white dark:bg-surface-dark custom-scrollbar">
  
  <!-- Logo Section -->
  <div class="h-16 flex items-center shrink-0 border-b border-gray-100 dark:border-gray-800/50"
       [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed">
    <div class="flex items-center gap-3 text-primary-600 dark:text-primary-500 transition-colors">
      <mat-icon class="text-2xl" [class.mr-0]="isCollapsed">dashboard_customize</mat-icon>
      <span *ngIf="!isCollapsed" class="text-xl font-bold tracking-tight text-gray-900 dark:text-white truncate">
        Farm360
      </span>
    </div>
  </div>

  <!-- Navigation List -->
  <mat-nav-list class="flex-1 overflow-y-auto px-3 py-4 custom-scrollbar">
    <ng-container *ngFor="let item of menuItems">
      <a mat-list-item
         [routerLink]="item.disabled ? null : item.route"
         routerLinkActive="bg-primary-50 dark:bg-primary-900/20 text-primary-700 dark:text-primary-400 font-semibold"
         [class.opacity-50]="item.disabled"
         [class.cursor-not-allowed]="item.disabled"
         [matTooltip]="isCollapsed ? item.label : ''"
         matTooltipPosition="right"
         class="rounded-md mb-1 text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800/50 hover:text-gray-900 dark:hover:text-gray-200">
        
        <div class="flex items-center w-full h-full" [class.justify-center]="isCollapsed">
          <mat-icon matListItemIcon [class.text-primary-600]="!item.disabled" [class.mr-0]="isCollapsed" class="!w-5 !h-5 !text-[20px]">{{ item.icon }}</mat-icon>
          
          <div *ngIf="!isCollapsed" class="flex items-center justify-between flex-1 ml-3 truncate">
            <span class="truncate">{{ item.label }}</span>
            <span *ngIf="item.badge" class="ml-2 px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wider text-accent-700 bg-accent-50 rounded-sm dark:bg-accent-900/30 dark:text-accent-400">
              {{ item.badge }}
            </span>
          </div>
        </div>

      </a>
    </ng-container>
  </mat-nav-list>

  <!-- Bottom Settings/Org Nav -->
  <div class="shrink-0 border-t border-gray-100 dark:border-gray-800/50 p-3">
    <mat-nav-list class="pt-0">
      <ng-container *ngFor="let item of bottomMenuItems">
        <a mat-list-item
           [routerLink]="item.route"
           routerLinkActive="bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white font-semibold"
           [matTooltip]="isCollapsed ? item.label : ''"
           matTooltipPosition="right"
           class="rounded-md mb-1 text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800/50 hover:text-gray-900 dark:hover:text-gray-200">
          
          <div class="flex items-center w-full h-full" [class.justify-center]="isCollapsed">
            <mat-icon matListItemIcon [class.mr-0]="isCollapsed" class="!w-5 !h-5 !text-[20px] text-gray-400 dark:text-gray-500">{{ item.icon }}</mat-icon>
            <span *ngIf="!isCollapsed" class="ml-3 truncate">{{ item.label }}</span>
          </div>
        </a>
      </ng-container>
    </mat-nav-list>
  </div>

</div>
